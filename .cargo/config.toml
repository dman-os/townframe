[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"', '--cfg', 'tokio_unstable']

[target.wasm32-wasip3]
rustflags = ['--cfg', 'getrandom_backend="custom"', '--cfg', 'tokio_unstable']

[alias]
x = "run --package xtask --"

[build]
rustflags = ["--cfg", "tokio_unstable"]

[profile.dev]
# One debuginfo file per dependency, to reduce file size of tests/examples.
# Note that this value is not supported on Windows.
# See https://doc.rust-lang.org/cargo/reference/profiles.html#split-debuginfo
split-debuginfo = "unpacked"
debug = "line-tables-only"

[profile.dev.package."*"]
debug = "line-tables-only"

[unstable]
feature-unification = true

[resolver]
feature-unification = "workspace"
