[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"', '--cfg', 'tokio_unstable']

[target.wasm32-wasip3]
# `--allow-multiple-definition`: clay_mdk defines a strong no-op
# `__pthread_tsd_run_dtors` to override wasi-sdk v34 libc's strong definition
# (which sweeps TSD destructors on every ReallocStart, mid-`activate`). Our
# object precedes `libc.a` on the link line, so first definition wins.
# wasm-component-ld takes the flag bare (no `-Wl,` prefix).
rustflags = [
  '--cfg',
  'getrandom_backend="custom"',
  '--cfg',
  'tokio_unstable',
  '-C',
  'link-arg=--allow-multiple-definition',
]

[alias]
x = "run --package xtask --"

[build]
rustflags = ["--cfg", "tokio_unstable"]

[profile.dev]
# No `split-debuginfo = "unpacked"`: mbx refuses to share a native link across
# checkouts when it is set, which leaves every build script, proc macro and test
# binary uncached. Line tables alone keep the embedded debuginfo small.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = "line-tables-only"

[unstable]
feature-unification = true

[resolver]
feature-unification = "workspace"
