[workspace]
resolver = "3"
members = [
  "./src/am_utils_rs",
  "./src/big_cabinet/",
  "./src/big_cabinet_core/",
  "./src/big_sync/",
  "./src/big_sync_core/",
  "./src/big_repo/",
  "./src/big_node/",
  "./src/daybook_cli",
  "./src/daybook_core",
  "./src/daybook_ffi",
  "./src/daybook_pdk",
  "./src/daybook_types",
  "./src/macros",
  "./src/mltools/",
  "./src/pauperfuse/",
  "./src/native_utils_rs",
  "./src/plug_test_manifest",
  "./src/plug_plabels_manifest",
  "./src/plug_dayledger_manifest",
  "./src/secrets_rs",
  "./src/service_core_rs/",
  "./src/service_client_rs/",
  "./src/service_utils_rs/",
  "./src/sqlite_rs/",
  "./src/sqlx_utils_rs/",
  "./src/utils_rs",
  "./src/wash_plugin_sqlite/",
  "./src/wash_plugin_wflow/",
  "./src/wflow/",
  "./src/wflow_core/",
  "./src/wflow_sdk",
  "./src/wflow_tokio/",
  "./src/xtask",
  "./src/clay_surface",
  "./src/clay_host",
  "./src/clay_docs",
  "./src/clay_collection",
  "./src/clay_micro_core",
  "./src/clay_dioxus",
  "./src/clay_mdk",
  "./src/clay_rt_wasmtime",
  "./src/clay_guest_session",
  "./src/micro_settings_manifest",
  "./src/micro_settings",
  "./src/micro_sample",
  "./src/micro_counter",
  "./src/micro_counter_manifest",
  "./src/ui",
  "./src/dayframe_web",
  "./src/dayframe_desktop",
  "./src/dayframe_mobile",
  "./src/dayframe_showcase",
]
exclude = [
  "src/wasm_utils_rs",
  "src/plug_test_routines",
  "src/plug_plabels_routines",
  "src/plug_dayledger_routines",
  "src/test_wflows",
  "src/btress_sysadmin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
authors = []
license = ""
repository = ""

[workspace.dependencies]
getrandom = { version = "0.4" }
getrandom03 = { package = "getrandom", version = "0.3" }
#
# internal
utils_rs = { path = "./src/utils_rs", default-features = false }
native_utils_rs = { path = "./src/native_utils_rs" }
sqlite_rs = { path = "./src/sqlite_rs", default-features = false }
sqlx_utils_rs = { path = "./src/sqlx_utils_rs", default-features = false }
wasm_utils_rs = { path = "./src/wasm_utils_rs", default-features = false }
am_utils_rs = { path = "./src/am_utils_rs", default-features = false  }
# btress_api = { path = "./src/btress_api" }
daybook_core = { path = "./src/daybook_core", default-features = false }
secrets_rs = { path = "./src/secrets_rs" }
service_core_rs = { path = "./src/service_core_rs", default-features = false }
service_client_rs = { path = "./src/service_client_rs", default-features = false }
service_utils_rs = { path = "./src/service_utils_rs", default-features = false }
# daybook_fuse = { path = "./src/daybook_fuse", default-features = false }
daybook_types = { path = "./src/daybook_types", default-features = false }
daybook_pdk = { path = "./src/daybook_pdk", default-features = false }
mltools = { path = "./src/mltools", default-features = false }
wflow = { path = "./src/wflow", default-features = false }
wflow_core = { path = "./src/wflow_core", default-features = false }
wflow_tokio = { path = "./src/wflow_tokio", default-features = false }
wflow_sdk = { path = "./src/wflow_sdk", default-features = false }
wash_plugin_sqlite = { path = "./src/wash_plugin_sqlite", default-features = false }
wash_plugin_wflow = { path = "./src/wash_plugin_wflow", default-features = false }
big_sync_core = { path = "./src/big_sync_core/", default-features = false }
big_sync = { path = "./src/big_sync/" }
big_repo = { path = "./src/big_repo/" }
big_node = { path = "./src/big_node/" }

#
# meta
syn = { version = "2", features = ["extra-traits"] }
proc-macro2 = "1"
quote = "1"
bon = "3.9"

#
# futures
async-trait = "0.1"
futures-buffered = { version = "0.2.13", features = ["tokio-coop"] }
futures = "0.3"
tokio = { version = "1.51", default-features = false }
tokio-util = { version = "0.7.17", features = [] }
async-lock = "3.4.2"
future_form = "0.3.1"
ahash = "0.8"
time = { version = "0.3", default-features = false, features = ["serde"] }
jiff = { version = "0.2", features = ["serde"] }
uuid = { version = "1", features = ["serde"] }
once_cell = "1"
parking_lot = "0.12"
bytes = "1"
url = { version = "2.5.7", features = ["serde"] }
addr = "0.15.6"
scopeguard = "1.2.0"
semver = { version = "1", features = ["serde"] }
surelock = "0.1"

#
# collections

#
# encoding
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
postcard = { version = "1.1.3", features = ["alloc"] }
serde_with = "3.16"
multihash = "0.19.3"
data-encoding = "2.10"
bs58 = "0.5.1"
blake3 = "1.8"
zstd = "0.13"
camino = { version = "1.2.2", features = ["serde1"] }
atproto-dasl = "0.14.5"

#
# macros
pastey = "0.1"
displaydoc = "0.2"
educe = "0.6"
struct-patch = "0.10.4"
structstruck = "0.5.1"

#
# errors
thiserror = "2"
anyhow = "1"
garde = { version = "0.22", features = ["derive", "regex", "url", "email"] }

#
# logging
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "parking_lot",
  "tracing-log"
] }
tracing-unwrap = "1.0"
tracing-appender = "0.2.3"
tracing-error = "0.2.1"
tracing-futures = "0.2.5"

#
# os
dotenv-flow = "0.16"
directories = "6.0"
rand = "0.9.2"
fs4 = "0.13.1"

#
# crypto
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
bao-tree = { version = "0.16", default-features = false, features = ["experimental-mixed", "tokio_fsm", "validate", "serde"] }
hkdf = "0.12"
sha2 = "0.10"

#
# http
axum = { version = "0.8.9", default-features = false }
axum-extra = { version = "0.12.6", default-features = false }
http = "1"
utoipa = { version = "5.4.0", features = ["debug", "uuid", "time", "smallvec",  "preserve_order"] }
# utoipa-swagger-ui = "9"
tower = "0.5"
tower-http = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "system-proxy", "json", "stream", "rustls-tls"] }

#
# sync
automerge = "0.11.0"
autosurgeon = "0.13.0"
automerge-test = "0.9"

subduction_core = { git = "https://github.com/dman-os/subduction", rev = "44cd14743b8ae2bf8b9eefb30e09618ef27d6f95" }
subduction_iroh = { git = "https://github.com/dman-os/subduction", rev = "44cd14743b8ae2bf8b9eefb30e09618ef27d6f95" }
