proptest = "1.12"
tempfile = "3"
loom = "0.7.2"

#
# db
sqlite-vec = "0.1.6" # "0.2.4-alpha"
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "time",
  "uuid",
  "macros",
  "json",
  "migrate",
  "ipnetwork",
] }

#
# ffi
uniffi = { version = "0.31.0" }
