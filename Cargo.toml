#
# wasm
wasmtime = { git = "https://github.com/dman-os/wasmtime", rev = "38daa7ef0db706828c6fdfd87302fe00212db084" }
# `default-features = false` matches wash-runtime's own wasmtime-wasi pin so the
# two deps do not disagree on the p1/p2 (wiggle) surface; `p3` is what links the
# WASI 0.3 imports a wasm32-wasip3 component brings in.
wasmtime-wasi = { version = "48.0.7", default-features = false, features = ["p3"] }
# Our fork's `townframe-changes`: upstream 1bcaebae plus the in-process
# `Ingress::dispatch_request` the nodule Wasm executor (`big_nodule_wasm`) calls, an
# `EngineBuilder::with_guest_stdio` hook for a workload's stdout/stderr, and a P3 guest trap
# that reaches the caller with its backtrace.
wash-runtime = { git = "https://github.com/dman-os/wasmCloud", rev = "f9c740425488ec045061c065636e4d4b8170d6eb", default-features = false }
wasmtime-wasi-http = { version = "48.0.7", default-features = false }
# `default-features = false` is load-bearing on wasm32-wasip3: wit-bindgen's `std` feature keeps the
# async export task state in a libc `thread_local!`, which cannot be swapped per component-model
# task. Without `std` it goes through the `wit_bindgen_0_62_0_{get,set}_task_context` hooks that
# `clay_mdk` defines over context slot 0 (see `clay_mdk/lib.rs`). Each guest crate names the
# features it needs; `x/check-daytxt.ts` fails if `std` comes back. The exact `=` pin is on
# purpose: `clay_mdk` defines `wit_bindgen_0_62_0_*` symbols, so a bump must be a visible edit there.
wit-bindgen = { version = "=0.62.0", default-features = false }
wstd = "0.6.8"
# The browser guest engine (ADR 018). Upstream pins `wasm-bindgen = "=0.2.126"`
# exactly; this fork moves only that pin to the 0.2.127 the Dioxus fork needs,
# because one lockfile serves every target. It brings its own
# `wasmtime-environ` 50 and `wasmparser` 0.261 next to wasmtime 48's.
wcmp = { git = "https://github.com/dman-os/wasm-component-model-polyfill", rev = "2a8d11a01d6630fabcca1730423e7103b4466d41" }
wcmp-wasm-core-wasmi = { git = "https://github.com/dman-os/wasm-component-model-polyfill", rev = "2a8d11a01d6630fabcca1730423e7103b4466d41" }
wcmp-wasm-core-web = { git = "https://github.com/dman-os/wasm-component-model-polyfill", rev = "2a8d11a01d6630fabcca1730423e7103b4466d41" }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4.77"
js-sys = "0.3.104"
web-sys = "0.3.104"
