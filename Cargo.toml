[workspace]
resolver = "3"
members = [
  "./src/am_utils_rs",
  "./src/api_utils_rs",
  "./src/big_sync/",
  "./src/big_sync_core/",
  "./src/big_repo/",
  "./src/btress_sysadmin/",
  "./src/daybook_cli",
  "./src/daybook_core",
  "./src/daybook_ffi",
  "./src/daybook_pdk",
  "./src/daybook_types",
  "./src/mltools/",
  "./src/plug_dayledger/",
  "./src/plug_plabels/",
  "./src/plug_test/",
  "./src/sqlx_utils_rs/",
  "./src/test_wflows",
  "./src/utils_rs",
  "./src/wash_plugin_sqlite/",
  "./src/wash_plugin_wflow/",
  "./src/wflow/",
  "./src/wflow_core/",
  "./src/wflow_sdk",
  "./src/wflow_tokio/",
  "./src/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
authors = []
license = ""
repository = ""

[workspace.dependencies]
#
# internal
utils_rs = { path = "./src/utils_rs", default-features = false }
sqlx_utils_rs = { path = "./src/sqlx_utils_rs", default-features = false }
api_utils_rs = { path = "./src/api_utils_rs", default-features = false  }
am_utils_rs = { path = "./src/am_utils_rs", default-features = false  }
# btress_api = { path = "./src/btress_api" }
daybook_core = { path = "./src/daybook_core", default-features = false }
# daybook_fuse = { path = "./src/daybook_fuse", default-features = false }
daybook_types = { path = "./src/daybook_types", default-features = false }
daybook_pdk = { path = "./src/daybook_pdk", default-features = false }
mltools = { path = "./src/mltools", default-features = false }
wflow = { path = "./src/wflow", default-features = false }
wflow_core = { path = "./src/wflow_core", default-features = false }
wflow_tokio = { path = "./src/wflow_tokio", default-features = false }
wflow_sdk = { path = "./src/wflow_sdk", default-features = false }
wash_plugin_sqlite = { path = "./src/wash_plugin_sqlite", default-features = false }
wash_plugin_wflow = { path = "./src/wash_plugin_wflow", default-features = false }
big_sync_core = { path = "./src/big_sync_core/", default-features = false }
big_sync = { path = "./src/big_sync/" }
big_repo = { path = "./src/big_repo/" }

#
# meta
syn = { version = "2", features = ["extra-traits"] }
bon = "3.9"

#
# futures
async-trait = "0.1"
futures-buffered = { version = "0.2.13", features = ["tokio-coop"] }
futures = "0.3"
tokio = { version = "1.51", default-features = false }
tokio-util = { version = "0.7.17", features = [] }
async-lock = "3.4.2"
future_form = "0.3.1"
ahash = "0.8"
time = { version = "0.3", default-features = false, features = ["serde"] }
uuid = { version = "1", features = ["serde"] }
once_cell = "1"
parking_lot = "0.12"
bytes = "1"
url = { version = "2.5.7", features = ["serde"] }
addr = "0.15.6"
scopeguard = "1.2.0"
semver = { version = "1", features = ["serde"] }
surelock = "0.1"

#
# encoding
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_with = "3.16"
multihash = "0.19.3"
data-encoding = "2.10"
bs58 = "0.5.1"
blake3 = "1.8"
zstd = "0.13"
camino = { version = "1.2.2", features = ["serde1"] }
atproto-dasl = "0.14.5"

#
# macros
pastey = "0.1"
displaydoc = "0.2"
educe = "0.6"
struct-patch = "0.10.4"
structstruck = "0.5.1"

#
# errors
thiserror = "2"
anyhow = "1"
garde = { version = "0.22", features = ["derive", "regex", "url", "email"] }

#
# logging
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "parking_lot",
  "tracing-log"
] }
tracing-unwrap = "1.0"
tracing-appender = "0.2.3"
tracing-error = "0.2.1"
tracing-futures = "0.2.5"

#
# os
dotenv-flow = "0.16"
directories = "6.0"
rand = "0.9.2"
fs4 = "0.13.1"

#
# http
axum = { version = "0.8.9", default-features = false }
axum-extra = { version = "0.12.6", default-features = false }
http = "1"
utoipa = { version = "5.4.0", features = ["debug", "uuid", "time", "smallvec",  "preserve_order"] }
# utoipa-swagger-ui = "9"
tower = "0.5"
tower-http = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "system-proxy", "json", "stream", "rustls-tls"] }

#
# sync
automerge = "0.11.0"
autosurgeon = "0.13.0"
automerge-test = "0.9"
subduction_core = { git = "https://github.com/dman-os/subduction", rev = "824c4a03c724ba663e43c0e7ee53b588b8d73d02" }
subduction_iroh = { git = "https://github.com/dman-os/subduction", rev = "824c4a03c724ba663e43c0e7ee53b588b8d73d02" }
subduction_websocket = { git = "https://github.com/dman-os/subduction", rev = "824c4a03c724ba663e43c0e7ee53b588b8d73d02" }
subduction_ephemeral = { git = "https://github.com/dman-os/subduction", rev = "824c4a03c724ba663e43c0e7ee53b588b8d73d02" }
sedimentree_core = { git = "https://github.com/dman-os/subduction", rev = "824c4a03c724ba663e43c0e7ee53b588b8d73d02" }
subduction_redb_storage = { git = "https://github.com/dman-os/subduction", rev = "824c4a03c724ba663e43c0e7ee53b588b8d73d02" }
subduction_crypto = { git = "https://github.com/dman-os/subduction", rev = "824c4a03c724ba663e43c0e7ee53b588b8d73d02" }
subduction_keyhive = { git = "https://github.com/dman-os/subduction", rev = "824c4a03c724ba663e43c0e7ee53b588b8d73d02" }

keyhive_crypto = { version = "0.2.1", git = "https://github.com/dman-os/keyhive", rev = "65ef136008e4b1a839b2f20bf59548bec858ddd8" }
keyhive_core = { version = "0.5.0", git = "https://github.com/dman-os/keyhive", rev = "65ef136008e4b1a839b2f20bf59548bec858ddd8" }
beekem = { version = "0.3.0", git = "https://github.com/dman-os/keyhive", rev = "65ef136008e4b1a839b2f20bf59548bec858ddd8" }

ed25519-dalek = "2.2.0"
async-channel = "2.5.0"
nonempty = "0.10.0"
qrcode = { version = "0.14.1", default-features = false }

#
# testing
insta = { version =  "1.44", features = ["yaml", "filters"] }
tempfile = "3"
loom = "0.7.2"

#
# db
sqlite-vec = "0.1.6" # "0.2.4-alpha"
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  # "tls-rustls-ring-webpki",
  "time",
  "uuid",
  "macros",
  "json",
  "migrate",
  "ipnetwork",
] }

#
# ffi
uniffi = { version = "0.31.0" }
# uniffi = { path = "../uniffi-rs/uniffi/" }

#
# wasm
wasmtime = "47"
wash-runtime = { git = "https://github.com/wasmCloud/wasmCloud", rev = "44fc4cf76a49a599b42dcb1466586b39f09ef658" }
wit-bindgen = "0.60.0"
wstd = "0.6.8"
# wash-runtime = { path = "../wash/crates/wash-runtime/"}

#
# cli
clap = "4.5"
clap_complete = "4.5"

# 
# networks
iroh = "1"
iroh-tickets = "1"
iroh-blobs = "0.103.0"

#
# actors
irpc = { version = "0.17.0", features = ["derive"] }
irpc-iroh = "0.17.0"

#
# gui
# xilem = { path = "../xilem/xilem/" }

[patch.crates-io]
autosurgeon = { git = "https://github.com/dman-os/autosurgeon", rev = "6a1df66f667667f1d14bc2272c4d426815de66b8" }
autosurgeon-derive = { git = "https://github.com/dman-os/autosurgeon", rev = "6a1df66f667667f1d14bc2272c4d426815de66b8" }
