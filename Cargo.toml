[workspace.lints]
clippy.clone_on_ref_ptr = "warn"
clippy.let_underscore_must_use = "warn"
clippy.let_underscore_untyped = "deny"
rust.let_underscore_drop = "deny"
# `methods!` / `service_method!` test the caller's `schemars` feature; a crate that declares
# methods without publishing Lexicons has no such feature, and its absence is the answer.
rust.unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("schemars"))'] }
