name: checks

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      tmate_enabled:
        type: boolean
        description: |
          Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate).
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXTEST_COLOR: always
  TEST_SEED: rand
  # Scheduled runs use the `nightly` nextest profile (`flaky-result = "fail"`) so flakes
  # surface as failures; PR/push runs keep `ci`, where a test that passes on retry is green.
  NEXTEST_PROFILE: ${{ github.event_name == 'schedule' && 'nightly' || 'ci' }}
  OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
  OLLAMA_USERNAME: ${{ secrets.OLLAMA_USERNAME }}
  OLLAMA_PASSWORD: ${{ secrets.OLLAMA_PASSWORD }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  # Decides what the rest of the run needs; see .github/scripts/ci-scope.sh for the rules.
  # Pushes to main, the nightly cron, manual dispatch and PRs labelled `full-ci` always get
  # the full suites. Other PRs run only the affected crates' tests and target matrix, skip
  # Rust jobs for docs-only changes, and run the heavy jobs (Nix packages, web E2E, CLI E2E)
  # only when their paths change or a `nix-heavy` / `e2e` label asks for them.
  changes:
    # Draft PRs skip CI; marking one ready for review runs it.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      full: ${{ steps.scope.outputs.full }}
      tests: ${{ steps.scope.outputs.tests }}
      packages: ${{ steps.scope.outputs.packages }}
      test_args: ${{ steps.scope.outputs.test_args }}
      nix: ${{ steps.scope.outputs.nix }}
      e2e_web: ${{ steps.scope.outputs.e2e_web }}
      e2e_cli: ${{ steps.scope.outputs.e2e_cli }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The three-dot diff against origin/main needs full history for the merge base.
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compute the CI scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PLAN_RUNNER: nix develop .#ci-rust --command
        run: .github/scripts/ci-scope.sh
  nix-packages:
    needs: changes
    # Draft PRs skip CI; marking one ready for review runs it. On PRs the heavy Nix builds also
    # need a path trigger or the `nix-heavy` label (see `changes`).
    if: github.event.pull_request.draft != true && needs.changes.outputs.nix == 'true'
    name: Nix package ${{ matrix.attr }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The guest and web builds share one vendored dependency set (dioxus,
          # wasmtime, blitz, ...) and compile wasmtime-environ for wasm, so a cold build
          # is very heavy; the `changes` job keeps them off PRs that cannot affect them.
          - attr: daytxt-packages
          - attr: daytxt-web
    env:
      OLLAMA_URL: ""
      OLLAMA_USERNAME: ""
      OLLAMA_PASSWORD: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            sandbox = true
      - uses: DeterminateSystems/flakehub-cache-action@v3
      # Source-only lint is not repeated here: `nix flake check` runs as a
      # pre-commit hook in the lint job. This job owns the package outputs.
      - name: Build ${{ matrix.attr }}
        env:
          ATTR: ${{ matrix.attr }}
        run: nix build --print-build-logs --no-link ".#$ATTR"
  rust-target-matrix:
    needs: changes
    # Draft PRs skip CI; marking one ready for review runs it. Docs-only PRs skip it.
    if: github.event.pull_request.draft != true && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm32-wasip3, wasm32-unknown-unknown]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src/wasm_utils_rs -> target
      - uses: wasmCloud/setup-wash-action@v2.1.0
        with:
          wash-version: v2.6.1
      - run: nix develop .#ci-rust --command deno run -A ./x/wit-fetch.ts --clean
      # Guardrail lint and formatting (all three workspaces) run once, in the
      # lint job; this matrix only compiles the per-target build contracts.
      # `ci-desktop`, not `ci-rust`: the native contract includes `daytxt_desktop`, which
      # links the Linux GUI stack (glib/gtk/wayland) through its `desktop` renderer feature.
      # `ci-rust` carries no pkg-config-visible glib, so the native lane there fails in
      # `glib-sys`' build script. This is the same reason the daytxt test lane below runs
      # in `ci-desktop`.
      # A full run checks every crate's contract; an affected-only PR run checks each affected
      # crate (a crate with no contract for the target selects zero builds, which is fine when
      # filtered by package).
      - name: Check build contracts
        env:
          TARGET: ${{ matrix.target }}
          FULL: ${{ needs.changes.outputs.full }}
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          if [ "$FULL" = true ]; then
            nix develop .#ci-desktop --command cargo x guardrails check-matrix --target "$TARGET"
          else
            for package in $PACKAGES; do
              nix develop .#ci-desktop --command cargo x guardrails check-matrix --target "$TARGET" --package "$package"
            done
          fi
      - name: Check browser wcmp adapter
        if: matrix.target == 'wasm32-unknown-unknown' && (needs.changes.outputs.full == 'true' || contains(needs.changes.outputs.packages, 'clay_rt_wcmp_web'))
        run: nix develop .#ci-desktop --command cargo x guardrails check-matrix --target wasm32-unknown-unknown --package clay_rt_wcmp_web
  # The single lint job. Hooks that only read sources delegate to the
  # hermetic `nix flake check` hook (cache hits make an unchanged tree free);
  # the remaining hooks need ./target, node_modules or git state.
  pre-commit:
    # Draft PRs skip CI; marking one ready for review runs it.
    if: github.event.pull_request.draft != true
    name: Lint (pre-commit + nix checks)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: DeterminateSystems/flakehub-cache-action@v3
      - name: Setup wash CLI
        uses: wasmCloud/setup-wash-action@v2.1.0
        with:
          wash-version: v2.6.1
      - name: install JavaScript dependencies
        run: nix develop .#ci-desktop --command pnpm install --frozen-lockfile
      - name: fetch WIT dependencies
        run: nix develop .#ci-desktop --command deno run -A ./x/wit-fetch.ts --clean --generate-auth-types
      - name: pre-commit hooks
        run: |
          nix develop .#ci-desktop --command prek --color=always run --all-files
  e2e-cli:
    name: E2E (CLI)
    needs: changes
    # Draft PRs skip CI; marking one ready for review runs it. On PRs it also needs a path
    # trigger or the `e2e` label (see `changes`).
    if: github.event.pull_request.draft != true && needs.changes.outputs.e2e_cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Setup tmate session
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tmate_enabled }}
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: DeterminateSystems/flakehub-cache-action@v3

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: setup wash CLI
        uses: wasmCloud/setup-wash-action@v2.1.0
        with:
          wash-version: v2.6.1

      - name: fetch WIT dependencies
        run: nix develop .#ci-rust --command deno run -A ./x/wit-fetch.ts --clean

      - name: build the intxt handler component
        run: nix develop .#ci-rust --command cargo --color=always build --locked --manifest-path src/wasm_utils_rs/Cargo.toml -p intxt_nodule_guest --target wasm32-wasip3 --release

      - name: build day_cli
        run: nix develop .#ci-rust --command cargo --color=always build -p day_cli

      - name: CLI E2E tests
        run: nix develop .#ci-rust --command cargo nextest run --color=always --profile "$NEXTEST_PROFILE" -p day_cli
        env:
          UTILS_RS_TIMEOUT_MULTIPLIER: 3

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cli-nextest-results
          path: '**/nextest/ci/results.xml'
          retention-days: 14


  tests:
    needs: changes
    # Draft PRs skip CI; marking one ready for review runs it. Docs-only PRs skip it; other PRs
    # test only the affected crates (the full workspace on main, nightly and `full-ci`).
    if: github.event.pull_request.draft != true && needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    # Preparing the daytxt Wasm guest fixtures takes about 35 minutes on a cold runner before
    # nextest starts, and the suite itself about 40; 90 cut the run off at the last test.
    timeout-minutes: 120
    steps:
      - name: Setup tmate session
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tmate_enabled }}
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true

      - name: remove unused files
        # based on https://dev.to/mathio/squeezing-disk-space-from-github-actions-runners-an-engineers-guide-3pjg
        run: |
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/microsoft /opt/google
          sudo rm -rf /opt/az
          sudo rm -rf /usr/local/share/powershell
          # sudo rm -rf /opt/hostedtoolcache

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: DeterminateSystems/flakehub-cache-action@v3

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: setup wash CLI
        uses: wasmCloud/setup-wash-action@v2.1.0
        with:
          wash-version: v2.6.1
      - name: fetch WIT dependencies
        run: nix develop .#ci-rust --command deno run -A ./x/wit-fetch.ts --clean
      - name: builds
        run: |
          nix develop .#ci-rust --command cargo --color=always build --locked --manifest-path src/wasm_utils_rs/Cargo.toml -p test_wflows --target wasm32-wasip3 --release
          nix develop .#ci-rust --command cargo --color=always build --locked --manifest-path src/wasm_utils_rs/Cargo.toml -p test_nodule_guest --target wasm32-wasip3 --release


      - name: rust tests
        run: |
          # `day_cli` is excluded because its e2e tests need the built binary (found at target/debug)
          # and run in the dedicated CLI job.
          # This lane runs in `ci-desktop` because the daytxt Dioxus crates link the Linux GUI
          # stack (glib/wayland/wgpu) through the workspace, and `ci-rust` does not carry it.
          #
          # Prepare the wasm guest components first: the clay_*/micro_* tests read
          # DAYTXT_<NAME>_COMPONENT paths printed by the prepare step.
          nix develop .#ci-desktop --command deno run --allow-all x/check-daytxt.ts --prepare-only > /tmp/daytxt-components.env
          # `set -a` exports every variable the prepare step prints, so a new fixture needs no
          # edit here (a hand-kept export list silently left new fixtures unset).
          set -a
          source /tmp/daytxt-components.env
          set +a
          #
          # `--no-report` accumulates llvm profile data across the nextest and doctest runs (it
          # implies `--no-clean`, so the earlier run's data survives) and the final `report`
          # invocation turns the whole lot into a single lcov file.
          nix develop .#ci-desktop --command cargo llvm-cov --no-report nextest \
            --color=always $TEST_ARGS --all-targets --profile "$NEXTEST_PROFILE" \
            --user-config-file .config/nextest-user-ci.toml
          # nextest cannot run doctests, so they go through `cargo test --doc`. `--doc` implies
          # `--doctests`, which persists the doctest binaries the coverage report needs.
          nix develop .#ci-desktop --command cargo llvm-cov --no-report --doc $TEST_ARGS
          # `report` only merges the collected profile data and writes lcov; it runs no tests.
          # `--doctests` is what lets the persisted doctest binaries be attributed to their sources.
          nix develop .#ci-rust --command cargo llvm-cov report --doctests --lcov --output-path lcov.info
          # Bail out loudly rather than upload an empty lcov to codecov: this file goes silently
          # empty when the test runs and the report disagree about `--doctests`.
          grep -q '^SF:' lcov.info || { echo 'lcov.info has no coverage records' >&2; exit 1; }
        env:
          # `--workspace --exclude day_cli` on a full run, `-p <crate> ...` for the affected
          # crates on a PR (computed by the `changes` job).
          TEST_ARGS: ${{ needs.changes.outputs.test_args }}
          UTILS_RS_TIMEOUT_MULTIPLIER: 3
          RUST_BACKTRACE: 1
          # info, not debug: nextest holds every running test's captured output in memory, and the
          # sync-heavy suites at debug most likely pushed the hosted runner out of memory late in the run: it
          # stopped answering and lost the job and its logs (#178, #184, #199). A failure's output still
          # reaches the JUnit artifact; rerun a test locally with RUST_LOG_TEST=debug for more.
          RUST_LOG_TEST: info
          # Record every captured stdout/stderr stream so a failed job can attach the full test
          # output as an artifact instead of relying on a truncated CI log.
          NEXTEST_EXPERIMENTAL_RECORD: 1
          NEXTEST_STATE_DIR: ${{ github.workspace }}/nextest-state

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nextest-results
          path: '**/nextest/ci/results.xml'

      - name: export nextest recording
        if: always()
        run: |
          if nix develop .#ci-rust --command cargo nextest store list | grep -qE '^ +[0-9a-f]{8} '; then
            nix develop .#ci-rust --command cargo nextest store export latest --archive-file nextest-run.zip
          else
            echo 'no recorded nextest run to export (the job died before nextest started)' >&2
          fi
        env:
          NEXTEST_EXPERIMENTAL_RECORD: 1
          NEXTEST_STATE_DIR: ${{ github.workspace }}/nextest-state

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nextest-recording
          path: nextest-run.zip
          retention-days: 14
          if-no-files-found: ignore
      - name: Publish Test Summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: |
            **/nextest/ci/results.xml

      - name: Upload coverage data to codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info

  e2e-daytxt-web-chromium:
    name: E2E (daytxt web / chromium)
    needs: changes
    # Draft PRs skip CI; marking one ready for review runs it. On PRs it also needs a path
    # trigger or the `e2e` label (see `changes`).
    if: github.event.pull_request.draft != true && needs.changes.outputs.e2e_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: DeterminateSystems/flakehub-cache-action@v3

      # `cache-on-failure`: a failed run on main must still save the target dir, or the next run
      # rebuilds every crate from scratch again.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Setup wash CLI
        uses: wasmCloud/setup-wash-action@v2.1.0
        with:
          wash-version: v2.6.1
      - name: fetch WIT dependencies
        run: nix develop .#ci-desktop --command deno run -A ./x/wit-fetch.ts --clean
      - name: Install dependencies
        run: nix develop .#ci-desktop --command pnpm install --frozen-lockfile --filter @townframe/daytxt_web
      # ADR 018 migration steps 6–7: the shared composition + counter guest on `daytxt_web`.
      # `x/daytxt-web.ts` prepares the guest component, builds the wasm32 host, runs
      # wasm-bindgen, copies the guest asset (bundle size is printed there for the §7 budget),
      # and serves the site. Building here first keeps the cold compile, about 20 minutes on an
      # empty cache, out of Playwright's 20-minute webServer timeout: the webServer's own run of
      # the script then finds every crate built. DAYTXT_WEB_TRAPPER matches what
      # `playwright.config.ts` sets, so the build includes the same packages it serves.
      - name: Build daytxt web
        run: nix develop .#ci-desktop --command deno run --allow-all ./x/daytxt-web.ts --build
        env:
          DAYTXT_WEB_TRAPPER: "1"
      - name: Run daytxt web e2e
        run: nix develop .#ci-desktop --command pnpm -C src/daytxt_web run e2e

      # Bombadil property-based exploration of the same build (ADR 032 section 9): 60 s at a phone
      # width and 60 s at a desktop width by default (BOMBADIL_TIME_LIMIT), driving the pinned
      # Chromium of the flake's browser farm, plus the web server's restart (the build itself is
      # already in the target directory). Adds roughly 3 to 4 minutes (2.0 minutes measured
      # locally for the exploration itself). Blocking: the layout collapse its first explorations
      # found (hiding a panel withdrew the layout; a synchronous cancel of a host call suspended a
      # sync export in the browser engine) is fixed in `wcmp` and held by a Playwright spec, and
      # ten consecutive 60 s runs at 420 px were green (docs/scratch/dayframe-shell-ledger.md, S8).
      - name: Explore daytxt web with Bombadil
        run: nix develop .#ci-desktop --command pnpm -C src/daytxt_web run bombadil

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: daytxt-web-e2e-artifacts
          path: |
            src/daytxt_web/test-results/
            src/daytxt_web/playwright-report/
          retention-days: 14
