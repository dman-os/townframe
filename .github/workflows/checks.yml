name: checks

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      tmate_enabled:
        type: boolean
        description: |
          Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate).
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXTEST_COLOR: always
  TEST_SEED: rand
  # Scheduled runs use the `nightly` nextest profile (`flaky-result = "fail"`) so flakes
  # surface as failures; PR/push runs keep `ci`, where a test that passes on retry is green.
  NEXTEST_PROFILE: ${{ github.event_name == 'schedule' && 'nightly' || 'ci' }}
  OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
  OLLAMA_USERNAME: ${{ secrets.OLLAMA_USERNAME }}
  OLLAMA_PASSWORD: ${{ secrets.OLLAMA_PASSWORD }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  nix-packages:
    name: Nix CLI package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      OLLAMA_URL: ""
      OLLAMA_USERNAME: ""
      OLLAMA_PASSWORD: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            sandbox = true
      - uses: DeterminateSystems/flakehub-cache-action@v3
      # Source-only lint is not repeated here: `nix flake check` runs as a
      # pre-commit hook in the lint job. This job owns the package outputs.
      - name: Build CLI and run its packaged round-trip test
        run: nix build --print-build-logs --no-link .#daybook-cli.tests.round-trip
  rust-target-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm32-wasip3, wasm32-unknown-unknown]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src/wasm_utils_rs -> target
      - uses: wasmCloud/setup-wash-action@v2.1.0
        with:
          wash-version: v2.6.1
      - run: nix develop .#ci-rust --command deno run -A ./x/wit-fetch.ts --clean
      # Guardrail lint and formatting (all three workspaces) run once, in the
      # lint job; this matrix only compiles the per-target build contracts.
      # `ci-desktop`, not `ci-rust`: the native contract includes `dayframe_desktop`, which
      # links the Linux GUI stack (glib/gtk/wayland) through its `desktop` renderer feature.
      # `ci-rust` carries no pkg-config-visible glib, so the native lane there fails in
      # `glib-sys`' build script. This is the same reason the dayframe test lane below runs
      # in `ci-desktop`.
      - run: nix develop .#ci-desktop --command cargo x guardrails check-matrix --target "${{ matrix.target }}"
      - name: Check browser wcmp adapter
        if: matrix.target == 'wasm32-unknown-unknown'
        run: nix develop .#ci-desktop --command cargo x guardrails check-matrix --target wasm32-unknown-unknown --package clay_rt_wcmp_web
  # The single lint job. Hooks that only read sources delegate to the
  # hermetic `nix flake check` hook (cache hits make an unchanged tree free);
  # the remaining hooks need ./target, node_modules or git state.
  pre-commit:
    name: Lint (pre-commit + nix checks)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: DeterminateSystems/flakehub-cache-action@v3
      - name: Setup wash CLI
        uses: wasmCloud/setup-wash-action@v2.1.0
        with:
          wash-version: v2.6.1
      - name: install JavaScript dependencies
        run: nix develop .#ci-desktop --command pnpm install --frozen-lockfile
      - name: fetch WIT dependencies
        run: nix develop .#ci-desktop --command deno run -A ./x/wit-fetch.ts --clean --generate-auth-types
      - name: pre-commit hooks
        run: |
          nix develop .#ci-desktop --command prek --color=always run --all-files
  e2e-cli:
    name: E2E (CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Setup tmate session
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tmate_enabled }}
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: DeterminateSystems/flakehub-cache-action@v3

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: setup wash CLI
        uses: wasmCloud/setup-wash-action@v2.1.0
        with:
          wash-version: v2.6.1

      - name: fetch WIT dependencies
        run: nix develop .#ci-rust --command deno run -A ./x/wit-fetch.ts --clean

      - name: build test plug OCI artifact
        run: nix develop .#ci-rust --command cargo --color=always x plug build-oci --plug-root ./src/plug_test_manifest

      - name: build daybook_cli
        run: nix develop .#ci-rust --command cargo --color=always build -p daybook_cli

      - name: CLI E2E tests
        run: nix develop .#ci-rust --command cargo nextest run --color=always --profile "$NEXTEST_PROFILE" -p daybook_cli
        env:
          UTILS_RS_TIMEOUT_MULTIPLIER: 3

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cli-nextest-results
          path: '**/nextest/ci/results.xml'
          retention-days: 14


  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Setup tmate session
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tmate_enabled }}
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true

      - name: remove unused files
        # based on https://dev.to/mathio/squeezing-disk-space-from-github-actions-runners-an-engineers-guide-3pjg
        run: |
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/microsoft /opt/google
          sudo rm -rf /opt/az
          sudo rm -rf /usr/local/share/powershell
          # sudo rm -rf /opt/hostedtoolcache

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: DeterminateSystems/flakehub-cache-action@v3

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: setup wash CLI
        uses: wasmCloud/setup-wash-action@v2.1.0
        with:
          wash-version: v2.6.1
      - name: fetch WIT dependencies
        run: nix develop .#ci-rust --command deno run -A ./x/wit-fetch.ts --clean
      - name: builds
        run: |
          nix develop .#ci-rust --command cargo --color=always build --locked --manifest-path src/wasm_utils_rs/Cargo.toml -p test_wflows --target wasm32-wasip3 --release

      - name: build plug OCI artifacts
        run: |
          nix develop .#ci-rust --command cargo --color=always x plug build-oci --plug-root ./src/plug_test_manifest
          nix develop .#ci-rust --command cargo --color=always x plug build-oci --plug-root ./src/plug_plabels_manifest
          nix develop .#ci-rust --command cargo --color=always x plug build-oci --plug-root ./src/plug_dayledger_manifest


      - name: rust tests
        run: |
          # Plug crates are excluded while automatic triage is broken. `daybook_cli` is excluded
          # because its e2e tests need the built binary and run in the dedicated CLI job.
          # This lane runs in `ci-desktop` because the Dayframe Dioxus crates link the Linux GUI
          # stack (glib/wayland/wgpu) through the workspace, and `ci-rust` does not carry it.
          #
          # Prepare the wasm guest components first: the clay_*/micro_* tests read
          # DAYFRAME_<NAME>_COMPONENT paths printed by the prepare step.
          nix develop .#ci-desktop --command deno run --allow-all x/check-dayframe.ts --prepare-only > /tmp/dayframe-components.env
          source /tmp/dayframe-components.env
          export DAYFRAME_COUNTER_COMPONENT DAYFRAME_SLOTS_COMPONENT
          #
          # `--no-report` accumulates llvm profile data across the nextest and doctest runs (it
          # implies `--no-clean`, so the earlier run's data survives) and the final `report`
          # invocation turns the whole lot into a single lcov file.
          nix develop .#ci-desktop --command cargo llvm-cov --no-report nextest \
            --color=always --workspace --all-targets --profile "$NEXTEST_PROFILE" \
            --user-config-file .config/nextest-user-ci.toml \
            --exclude daybook_cli --exclude plug_test_manifest --exclude plug_dayledger_manifest --exclude plug_plabels_manifest
          # nextest cannot run doctests, so they go through `cargo test --doc`. `--doc` implies
          # `--doctests`, which persists the doctest binaries the coverage report needs.
          nix develop .#ci-desktop --command cargo llvm-cov --no-report --doc --workspace \
            --exclude daybook_cli --exclude plug_test_manifest --exclude plug_dayledger_manifest --exclude plug_plabels_manifest
          # `report` only merges the collected profile data and writes lcov; it runs no tests.
          # `--doctests` is what lets the persisted doctest binaries be attributed to their sources.
          nix develop .#ci-rust --command cargo llvm-cov report --doctests --lcov --output-path lcov.info
          # Bail out loudly rather than upload an empty lcov to codecov: this file goes silently
          # empty when the test runs and the report disagree about `--doctests`.
          grep -q '^SF:' lcov.info || { echo 'lcov.info has no coverage records' >&2; exit 1; }
        env:
          UTILS_RS_TIMEOUT_MULTIPLIER: 3
          RUST_BACKTRACE: 1
          RUST_LOG_TEST: debug
          # Record every captured stdout/stderr stream so a failed job can attach the full test
          # output as an artifact instead of relying on a truncated CI log.
          NEXTEST_EXPERIMENTAL_RECORD: 1
          NEXTEST_STATE_DIR: ${{ github.workspace }}/nextest-state

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nextest-results
          path: '**/nextest/ci/results.xml'

      - name: export nextest recording
        if: failure()
        run: |
          if nix develop .#ci-rust --command cargo nextest store list | grep -qE '^ +[0-9a-f]{8} '; then
            nix develop .#ci-rust --command cargo nextest store export latest --archive-file nextest-run.zip
          else
            echo 'no recorded nextest run to export (the job died before nextest started)' >&2
          fi
        env:
          NEXTEST_EXPERIMENTAL_RECORD: 1
          NEXTEST_STATE_DIR: ${{ github.workspace }}/nextest-state

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: nextest-recording
          path: nextest-run.zip
          if-no-files-found: ignore
      - name: Publish Test Summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: |
            **/nextest/ci/results.xml

      - name: Upload coverage data to codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info

  e2e-sysadmin-chromium:
    name: E2E (sysadmin / chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      DOCKER_CMD: docker
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "2500"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: DeterminateSystems/flakehub-cache-action@v3

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Setup wash CLI
        uses: wasmCloud/setup-wash-action@v2.1.0
        with:
          wash-version: v2.6.1
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(nix develop .#default --command pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        id: pnpm-store-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - name: Install dependencies
        run: nix develop .#default --command pnpm install --frozen-lockfile
      - name: fetch WIT dependencies
        run: nix develop .#default --command deno run -A ./x/wit-fetch.ts --clean --generate-auth-types
      - name: Save pnpm store
        if: github.ref == 'refs/heads/main' && steps.pnpm-store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Build workloads and host
        run: |
          nix develop .#default --command bash -lc '
            set -euo pipefail
            pnpm -C src/btress_auth run build
            cd src/btress_sysadmin
            cargo leptos build --release
            cd ../..
            cargo build --locked -p daybook_cli
          '

      - name: Run sysadmin e2e
        run: |
          nix develop .#default --command bash -lc '
            set -euo pipefail

            server_pid=""
            static_pid=""
            cleanup() {
              status=$?
              set +e
              if [ -n "$static_pid" ]; then kill "$static_pid" 2>/dev/null || true; fi
              if [ -n "$server_pid" ]; then kill "$server_pid" 2>/dev/null || true; fi
              docker compose -f tools/compose.yml --profile mail down -v
              exit "$status"
            }
            trap cleanup EXIT

            ./x/compose-up.ts mail
            setsid env SMTP_HOST="$SMTP_HOST" SMTP_PORT="$SMTP_PORT" ./target/debug/daybook_cli server \
              >/tmp/btress-server.log 2>&1 </dev/null &
            server_pid=$!
            setsid deno run --allow-all x/dev-btress-static.ts \
              >/tmp/btress-static.log 2>&1 </dev/null &
            static_pid=$!

            wait_for() {
              name="$1"
              url="$2"
              for _ in $(seq 1 90); do
                if curl -fsS --max-time 5 -o /dev/null "$url"; then return 0; fi
                sleep 2
              done
              echo "Timed out waiting for $name at $url"
              tail -100 /tmp/btress-server.log /tmp/btress-static.log 2>/dev/null || true
              return 1
            }

            wait_for Inbucket http://localhost:9020/
            wait_for btress-auth http://localhost:8071/healthz
            wait_for btress-sysadmin http://localhost:3000/
            wait_for static-assets http://localhost:3001/pkg/btress_sysadmin.js
            pnpm -C src/btress_sysadmin run e2e -- --project=chromium
          '

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: btress-sysadmin-e2e-artifacts
          path: |
            src/btress_sysadmin/test-results/
            src/btress_sysadmin/playwright-report/
            /tmp/btress-server.log
            /tmp/btress-static.log
          retention-days: 14

  e2e-dayframe-web-chromium:
    name: E2E (dayframe web / chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: DeterminateSystems/flakehub-cache-action@v3

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Setup wash CLI
        uses: wasmCloud/setup-wash-action@v2.1.0
        with:
          wash-version: v2.6.1
      - name: fetch WIT dependencies
        run: nix develop .#ci-desktop --command deno run -A ./x/wit-fetch.ts --clean
      - name: Install dependencies
        run: nix develop .#ci-desktop --command pnpm install --frozen-lockfile --filter @townframe/dayframe_web
      # ADR 018 migration steps 6–7: the shared composition + counter guest on `dayframe_web`.
      # Playwright's webServer runs `x/dayframe-web.ts`, which prepares the guest component,
      # builds the wasm32 host, runs wasm-bindgen, copies the guest asset, and serves the site
      # (bundle size is printed there for the §7 budget).
      - name: Run dayframe web e2e
        run: nix develop .#ci-desktop --command pnpm -C src/dayframe_web run e2e

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dayframe-web-e2e-artifacts
          path: |
            src/dayframe_web/test-results/
            src/dayframe_web/playwright-report/
          retention-days: 14
