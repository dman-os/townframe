repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        exclude: gh_action/dist/.*.js
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      # - id: end-of-file-fixer
      #   # exclude all generated files
      #   exclude: |
      #     (?x)^(
      #         Cargo.lock|
      #         gh_action/.*.js
      #     )$
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.36.2
    hooks:
      - id: check-dependabot
      - id: check-github-workflows
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.13.0
    hooks:
      - id: commitizen
        stages:
          - commit-msg
  - repo: local
    hooks:
      - id: zizmor 
        name: check CI config
        language: system
        entry: zizmor .github/
        pass_filenames: false
        # Kept out of the default run on purpose: with the pattern fixed this hook reports 122
        # findings (90 unpinned `uses:` refs, plus template-injection, cache-poisoning and
        # excessive-permissions). Run it deliberately with `prek run --stage manual zizmor` until
        # that backlog is cleared.
        files: ^\.github/
        stages: [manual]
      - id: detekt-kotlin
        name: detekt Kotlin
        language: system
        entry: ./x/gradle.ts detektMainDesktop --auto-correct --no-daemon
        pass_filenames: false
        files: ^src/daybook_compose/
      - id: syncpack-fmt
        name: syncpack format
        language: system
        entry: pnpm syncpack format
        pass_filenames: false
      - id: syncpack-lint
        name: syncpack lint
        language: system
        entry: pnpm syncpack lint
        pass_filenames: false
      - id: pnpm-install
        name: pnpm install
        language: system
        entry: pnpm install --frozen-lockfile
        pass_filenames: false
      - id: check-tsc
        name: check tsc
        language: system
        entry: deno run -A ./x/check-tsc.ts
        pass_filenames: false
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: clippy
        args:
          - "--locked"
          - "--all-features"
          - "--all-targets"
          - "--"
          - "--deny"
          - "warnings"
  - repo: local
    hooks:
      # Every source-only check (nixfmt/statix/deadnix, rustfmt incl. orphan
      # files, deno fmt/lint/check of x/, biome, JSON/TOML/YAML validity and
      # case collisions) lives in src/nix/checks.nix. Fix formatting with
      # `nix fmt`. Unchanged inputs are cache hits, so this is cheap to rerun.
      - id: nix-flake-check
        name: hermetic source checks (nix flake check)
        language: system
        entry: nix flake check --print-build-logs
        pass_filenames: false
      - id: sqlite-gen
        name: check generated SQLite queries and embedded migrations
        language: system
        entry: ./x/agent-build.ts -- cargo x sql gen --check --all
        pass_filenames: false
      - id: guardrails-lint
        name: check AST, architecture, migration-identity, and doc guardrails
        language: system
        entry: ./x/agent-build.ts -- cargo x guardrails lint
        pass_filenames: false
      - id: guardrails-api
        name: check boundary crate public API snapshots
        language: system
        entry: ./x/agent-build.ts -- cargo x guardrails api --all --check
        pass_filenames: false
      - id: guardrails-doctor
        name: check build flags and toolchain configuration
        language: system
        entry: ./x/agent-build.ts -- cargo x guardrails doctor
        pass_filenames: false
