[package]
name = "service_utils_rs"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[features]
default = []
# Serving over TCP and Unix sockets: tokio's `net` and runtime and hyper-util's tokio adapters,
# none of which has a browser build. Without it the crate is the portable core (hosts, router,
# admission, the iroh handler) and builds for wasm32.
net = ["tokio/net", "tokio/rt", "hyper-util/tokio"]
# HTTP/1 XRPC served over Iroh connections, in addition to TCP.
iroh-http = [
  "dep:iroh",
  "dep:service_client_iroh_rs",
  "service_client_native_rs/iroh",
]

[dependencies]
method_core.workspace = true
service_core_rs.workspace = true
service_client_core_rs.workspace = true
service_client_native_rs.workspace = true
service_client_iroh_rs = { workspace = true, optional = true }
#
# async
futures.workspace = true
# Channels, watch, `select!` and the I/O traits; spawning and timers are n0-future's. `rt` is
# only what `task_local!` and tokio-util's `TaskTracker` are gated on: nothing here starts a
# tokio runtime or task.
tokio = { workspace = true, features = ["sync", "macros", "rt", "io-util"] }
tokio-util = { workspace = true, features = ["rt"] }
n0-future.workspace = true
async-lock.workspace = true
irpc.workspace = true

#
# http
axum = { workspace = true, default-features = false, features = ["http1", "json", "query"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service"] }
mime = "0.3"
# No default features, as in `service_client_iroh_rs`: they pick a native TLS provider. Whoever
# builds the `Endpoint` picks its provider.
iroh = { version = "1", default-features = false, optional = true }

#
# encoding
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"
uuid = { version = "1", features = ["serde", "v7"] }
tracing-opentelemetry = "0.32"

#
# error and log
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# The tests serve over TCP and Unix sockets and call through the HTTP client.
service_utils_rs = { path = ".", features = ["net"] }
service_client_native_rs = { workspace = true, features = ["xrpc"] }
url.workspace = true
tempfile.workspace = true
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace"] }
reqwest.workspace = true
tokio = { workspace = true, features = ["full", "tracing"] }
tracing-subscriber.workspace = true
