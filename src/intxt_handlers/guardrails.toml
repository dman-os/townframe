version = 1
role = "plugin"
dependency_reason = "intxt's nodule handlers (createIntxt, addToIntxt), written on the nodule development kit and shared by the wasm guest and the native test harness"
allowed_dependencies = [
    "big_cabinet_core",
    "big_ndk",
    "intxt_core",
    "method_core",
    "service_client_core_rs",
    "service_core_rs",
]
allow_external_api_types = false

[builds.native]
features = ["schemars"]

[builds.wasm32-wasip3]
