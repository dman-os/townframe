[package]
name = "intxt_handlers"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

# Host-only: the schemas an operation's Lexicon is projected from. The `methods!` macro and the
# derives test this crate's own feature, which a wasm guest never enables.
[features]
schemars = ["dep:schemars", "big_cabinet_core/schemars", "method_core/schemars"]

[dependencies]
big_cabinet_core = { path = "../big_cabinet_core", default-features = false }
big_ndk.workspace = true
intxt_core = { path = "../intxt_core" }
method_core.workspace = true
service_client_core_rs.workspace = true
service_core_rs.workspace = true
schemars = { version = "1.2", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
