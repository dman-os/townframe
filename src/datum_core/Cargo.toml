[package]
name = "datum_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[features]
schemars = ["dep:schemars", "dep:thiserror", "dep:displaydoc"]
# `DatumShape` for the foreign leaf types `jiff::Timestamp` and `automerge::ChangeHash`. The orphan rule keeps these impls in this crate, where the trait is
# local, so a crate that holds those types turns the feature on and a guest that does not never
# links them.
jiff = ["dep:jiff"]
automerge = ["dep:automerge"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
# `Extra` keeps the field order a peer sent; `serde_json::Map` is a `BTreeMap` here.
indexmap = { version = "2", features = ["serde"] }
# The `datum` macro joins a const authority to a member's name in a const.
const_format = "0.2.37"
schemars = { version = "1.2", features = ["jiff02", "indexmap2"], optional = true }
thiserror = { workspace = true, optional = true }
displaydoc = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
automerge = { workspace = true, optional = true }

[dev-dependencies]
macros.workspace = true
serde = { workspace = true, features = ["derive"] }
