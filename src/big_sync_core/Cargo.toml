[package]
name = "big_sync_core"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[features]
default = ["uniffi", "test-support", "automerge"]
uniffi = ["dep:uniffi"]
automerge = ["dep:autosurgeon"]
test-support = []
# Message correlation only; disabled builds retain the original channel layout.
channel-trace = []

[dependencies]
utils_rs = { workspace = true, features = ["hash"] }

rand.workspace = true

structstruck.workspace = true

#
# collections

#
# encoding
blake3.workspace = true
ed25519-dalek.workspace = true
bs58.workspace = true
serde.workspace = true
postcard.workspace = true
siphasher = "1.0.3"
autosurgeon = { workspace = true, optional = true }

#
# errors
thiserror.workspace = true

#
# async
# tokio-util.workspace = true
async-channel.workspace = true
async-trait.workspace = true
future_form.workspace = true
parking_lot.workspace = true

#
# logging
tracing.workspace = true

#
# ffi
uniffi = { workspace = true, optional = true }

[dev-dependencies]
ed25519-dalek = { workspace = true, features = ["hazmat"] }
sha2 = "0.10"
futures.workspace = true
serde_json.workspace = true
