version = 1
role = "application"
dependency_reason = "claytxt microkernel layering: engine-neutral contracts at the bottom, micros above them, composition roots on top"
allowed_dependencies = [
    "clay_dioxus_kit",
    "clay_dioxus_specimens",
    "pierre_diffs_dioxus",
    "review_mock",
]
allow_external_api_types = false

[builds.native]
features = ["desktop"]
required_features = ["desktop"]

# `default` is `desktop`, whose Wry stack links native-tls (openssl-sys): the browser build
# never takes the defaults.
[builds.wasm32-unknown-unknown]
features = ["web"]
required_features = ["web"]
default_features = false
