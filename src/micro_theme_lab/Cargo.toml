[package]
name = "micro_theme_lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
#
# internal
clay_dioxus_kit = { workspace = true }
micro_shell_manifest = { workspace = true }
micro_theme_lab_manifest = { workspace = true }
#
# external
dioxus = { git = "https://github.com/dman-os/dioxus", rev = "1696518a2c449f44c0d2d4ac1fedd00127058d63", default-features = false, features = ["macro", "signals", "hooks", "html"] }

# One authored micro, two backends (isomorphic MDK): a wasm32-wasip3 build is the guest, every
# other target links the in-process backend.
[target.'cfg(target_os = "wasi")'.dependencies]
clay_mdk = { workspace = true, features = ["guest"] }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
clay_mdk = { workspace = true, features = ["in_process", "view"] }

[dev-dependencies]
dioxus-core = { workspace = true }

[lints]
workspace = true
