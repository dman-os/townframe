[package]
name = "pauperfuse"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
name = "pauperfuse"
path = "lib.rs"

[features]
# The SQLite store, schema in `sql/`. Off by default: the core, the memory store and the
# filesystem backend need no database.
sqlite = ["dep:sqlx", "dep:sqlx_utils_rs"]

[dependencies]
#
# internal
utils_rs = { workspace = true, default-features = false, features = ["hash"] }

#
# async
async-trait.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync"] }

#
# encoding
blake3.workspace = true

#
# error
thiserror.workspace = true
displaydoc.workspace = true

#
# db
sqlx = { workspace = true, features = ["sqlite"], optional = true }
sqlx_utils_rs = { workspace = true, default-features = false, optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "tracing"] }
