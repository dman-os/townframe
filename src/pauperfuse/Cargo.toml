[package]
name = "pauperfuse"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
name = "pauperfuse"
path = "lib.rs"

[features]
# Unix-local observed trees, with historical migrations in `sql/`. Off by default.
sqlite = ["dep:sqlx"]

[dependencies]
#
# internal
utils_rs = { workspace = true, default-features = false }

#
# async
tokio = { workspace = true, features = ["fs", "io-util", "rt"] }

#
# encoding
blake3.workspace = true

#
# serialization (FileEvidence serializes into checkout marker receipts)
serde.workspace = true

#
# error
thiserror.workspace = true
displaydoc.workspace = true

#
# db
sqlx = { workspace = true, features = ["sqlite"], optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "tracing"] }
