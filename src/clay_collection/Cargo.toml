[package]
name = "clay_collection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The crate root is the package root, so the `tests` module directory (`tests.rs` + `tests/<topic>.rs`)
# would otherwise be auto-discovered as Cargo integration-test targets.
autotests = false

[lib]
path = "lib.rs"

[dependencies]
clay_store.workspace = true
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
sqlite_rs.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
