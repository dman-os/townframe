[package]
name = "clay_mdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "lib.rs"

[[example]]
name = "slots"
path = "slot_fixture.rs"
crate-type = ["cdylib"]
required-features = ["dioxus"]

[dependencies]
clay_collection = { workspace = true }
wit-bindgen.workspace = true
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
dioxus = { workspace = true, default-features = false, features = ["macro", "signals", "hooks", "html"], optional = true }
dioxus-core = { workspace = true, optional = true }
dioxus-html = { workspace = true, optional = true }
clay_host = { workspace = true, optional = true }
clay_docs = { workspace = true, optional = true }
clay_micro_core = { workspace = true, optional = true }
clay_dioxus = { workspace = true, optional = true }
clay_rt_wasmtime = { workspace = true, optional = true }
daybook_types = { workspace = true, default-features = false, features = ["manifest"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
clay_surface = { workspace = true }
insta.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
wasmtime.workspace = true
serde_json.workspace = true
dioxus-core.workspace = true
dioxus-html.workspace = true
dioxus-native-dom.workspace = true
blitz-dom.workspace = true

[features]
default = ["wit", "dioxus"]
# WIT guest bindings + the typed mirror authoring surface over them.
wit = []
# In-process backend: one authoring API over clay_host/clay_docs handles, with provider assembly
# over clay_micro_core. Renderer-agnostic — a context publishes through whichever
# `RendererRegistry` the composition root installed, so this feature names no renderer. Micro
# crates depend on this, never on the host-side crates directly.
in_process = ["dep:clay_host", "dep:clay_docs", "dep:clay_micro_core", "dep:daybook_types"]
# The Dioxus half of the in-process backend: the view-side slot component and collection hook,
# built on the clay_dioxus renderer adapter. Micros with a host-linked view need this; contract
# crates and headless compositions do not.
view = ["in_process", "dep:clay_dioxus", "dep:dioxus"]
# Wasm provider assembly for composition roots that link the Wasmtime engine. Renderer-bound by
# nature: a guest renders into a wire surface, and projecting one is the adapter's job.
wasmtime = ["view", "dep:clay_rt_wasmtime"]
# The Dioxus guest VirtualDom adapter (GuestDom, WireMutations).
dioxus = ["wit", "dep:dioxus", "dep:dioxus-core", "dep:dioxus-html"]
