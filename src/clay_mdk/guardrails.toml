version = 1
role = "interface"
dependency_reason = "dayframe microkernel layering: engine-neutral contracts at the bottom, micros above them, composition roots on top"
allowed_dependencies = [
    "clay_collection",
    "clay_dioxus",
    "clay_docs",
    "clay_guest_session",
    "clay_host",
    "clay_rt_wasmtime",
    "clay_rt_wcmp",
    "clay_surface",
    "daybook_types",
]
allow_external_api_types = false

# Both engines compose through this crate: Wasmtime is native-only (cfg-gated dep); `wcmp`
# links on wasm32 for the browser shell. Features ≤8 so the matrix needs no powerset.
[builds.native]
features = ["contract", "in_process", "view", "wasmtime", "wcmp", "package"]
required_features = ["guest", "wit"]

[builds.wasm32-unknown-unknown]
features = ["contract", "in_process", "view", "wcmp", "package"]
required_features = ["guest", "wit"]

# Guest-side authoring (the guest backend over the WIT imports) as a wasip3 component.
[builds.wasm32-wasip3]
required_features = ["guest", "wit"]

[[exemptions]]
code = "ERROR_DEPENDENCY_GROUP"
path = "src/clay_mdk/Cargo.toml"
symbol = "dependency-groups"
ceiling = 11
class = "LEGACY_DEBT"
reason = "internal crates are not yet grouped under a `#` / `# internal` comment header: move them into one group at the top of each dependency table"
reference = "docs/scratch/nodule-runtime-ledger.md"
