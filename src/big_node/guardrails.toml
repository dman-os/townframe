version = 1
role = "application"
dependency_reason = "The node owns Cabinet, BigRepo and nodule service lifetimes; its tests exercise their public domain and sync contracts."
allowed_dependencies = [
    "big_blobs",
    "big_blobs_core",
    "big_cabinet",
    "big_cabinet_core",
    "big_nodule",
    "big_nodule_core",
    "big_plugs_core",
    "big_repo",
    "big_sync",
    "big_sync_core",
    "secrets_rs",
    "service_utils_rs",
    "sqlite_rs",
    "utils_rs",
]
allow_external_api_types = false

[api]
target = "x86_64-unknown-linux-gnu"
default_features = true
features = []

[builds.native]
