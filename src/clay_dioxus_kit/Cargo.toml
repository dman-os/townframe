[package]
name = "clay_dioxus_kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "lib.rs"

[lints]
workspace = true

[dependencies]
# Spelled out (not `dioxus.workspace = true`) so default features stay off: the wasip3 guest
# build has no renderer, launcher or document integration to link, exactly like `clay_mdk`'s
# guest-side `dioxus` dependency.
dioxus = { git = "https://github.com/dman-os/dioxus", rev = "a3e1e68334b7dfa68cead38e9e8795ec7a6b534a", default-features = false, features = ["macro", "signals", "hooks", "html"] }

[dev-dependencies]
dioxus_storm.workspace = true
dioxus-core.workspace = true
dioxus-html = { workspace = true, features = ["serialize"] }
serde_json.workspace = true
