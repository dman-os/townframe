[package]
name = "clay_dioxus_kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "lib.rs"

[lints]
workspace = true

[features]
# The host-side stylesheet loader (`FoundationStyles`, `ThemeRoot`): links the generated bundle
# as a manganis asset and injects it with `document::Link`, which a wasm guest (no renderer, no
# document integration, no asset pipeline) must not link. Native hosts and the browser build
# turn it on; a guest micro never does.
host = ["dioxus/asset", "dioxus/document"]

[dependencies]
# Spelled out (not `dioxus.workspace = true`) so default features stay off: the wasip3 guest
# build has no renderer, launcher or document integration to link, exactly like `clay_mdk`'s
# guest-side `dioxus` dependency.
dioxus = { git = "https://github.com/dman-os/dioxus", rev = "49e05de24022388ee0e36802edf59897dbe41db3", default-features = false, features = ["macro", "signals", "hooks", "html"] }

[dev-dependencies]
#
# internal
clay_surface.workspace = true
dioxus_storm.workspace = true

#
# misc
dioxus-core.workspace = true
dioxus-html = { workspace = true, features = ["serialize"] }
serde_json.workspace = true
