[package]
name = "clay_dioxus_specimens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "lib.rs"

[lints]
workspace = true

[dependencies]
#
# internal
clay_dioxus_kit = { workspace = true }
#
# external
# Spelled out (not `dioxus.workspace = true`) so default features stay off, like the kit: the
# wasip3 guest build has no renderer, launcher or document integration to link.
dioxus = { git = "https://github.com/dman-os/dioxus", rev = "49e05de24022388ee0e36802edf59897dbe41db3", default-features = false, features = ["macro", "signals", "hooks", "html"] }
