version = 1
role = "interface"
dependency_reason = "Native transports (in-process, irpc, hyper XRPC over TCP, Unix sockets, and iroh through `service_client_iroh_rs`) implement the service client core's transport traits."
allowed_dependencies = ["method_core", "service_client_core_rs", "service_client_iroh_rs", "service_core_rs"]
allow_external_api_types = false

[api]
target = "x86_64-unknown-linux-gnu"
default_features = true
features = ["iroh", "xrpc"]

[builds.native]
features = ["iroh", "xrpc"]

# The portable core: the direct and irpc transports, the websocket framing and the iroh
# transport. XRPC over TCP or a Unix socket (`xrpc`) is the native extra.
[builds.wasm32-unknown-unknown]
features = ["iroh"]
