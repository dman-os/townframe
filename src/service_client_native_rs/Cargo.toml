[package]
name = "service_client_native_rs"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[features]
default = []
# The `Transport::Iroh` variant: XRPC to a peer over iroh streams.
iroh = ["dep:service_client_iroh_rs"]

[dependencies]
method_core.workspace = true
service_core_rs.workspace = true
service_client_core_rs.workspace = true
service_client_iroh_rs = { workspace = true, optional = true }
futures.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "rt", "time", "net", "io-util"] }
irpc.workspace = true
serde.workspace = true
serde_json.workspace = true
http.workspace = true
uuid = { version = "1", features = ["v7"] }
reqwest.workspace = true
serde_urlencoded = "0.7"
base64 = "0.22"
sha1 = "0.10"

[dev-dependencies]
tracing.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
