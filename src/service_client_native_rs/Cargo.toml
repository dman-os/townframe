[package]
name = "service_client_native_rs"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[features]
default = []
# The `Transport::Iroh` variant: XRPC to a peer over iroh streams.
iroh = ["dep:service_client_iroh_rs"]
# The `Transport::Xrpc` variant and `XrpcClient`: HTTP over TCP or a Unix socket through reqwest
# and tokio's `net`, which have no browser build. Without it the crate is the portable core of
# the client (direct and irpc transports, the websocket framing) and builds for wasm32.
xrpc = ["dep:reqwest", "tokio/net"]

[dependencies]
rand.workspace = true
method_core.workspace = true
service_core_rs.workspace = true
service_client_core_rs.workspace = true
service_client_iroh_rs = { workspace = true, optional = true }
futures.workspace = true
# Channels, `select!` and the I/O traits only; the runtime is n0-future's.
tokio = { workspace = true, features = ["sync", "macros", "io-util"] }
n0-future.workspace = true
irpc.workspace = true
serde.workspace = true
serde_json.workspace = true
http.workspace = true
uuid = { version = "1", features = ["v7"] }
reqwest = { workspace = true, optional = true }
serde_urlencoded = "0.7"
base64 = "0.22"
sha1 = "0.10"

[dev-dependencies]
tracing.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
