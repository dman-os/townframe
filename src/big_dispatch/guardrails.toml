version = 1
role = "runtime"
dependency_reason = "Dispatch is the node's one router: it verifies the caller's capability through the authority service, resolves the NSID to a provider in an in-memory routing table and calls it under the caller's deadline. Providers are registered by their owners, and the adapter that serves a hosted service by NSID needs only the service runtime."
allowed_dependencies = [
    "big_cabinet",
    "big_cabinet_core",
    "big_dispatch_core",
    "method_core",
    "secrets_rs",
    "service_client_native_rs",
    "service_utils_rs",
    "sqlite_rs",
]
allow_external_api_types = false

[api]
target = "x86_64-unknown-linux-gnu"
default_features = true
features = []

[builds.native]
