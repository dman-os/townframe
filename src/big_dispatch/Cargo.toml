[package]
name = "big_dispatch"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[dependencies]
method_core.workspace = true
method_lexicon = { path = "../method_lexicon" }
# internal
big_cabinet = { path = "../big_cabinet" }
big_cabinet_core = { path = "../big_cabinet_core" }
big_dispatch_core.workspace = true
service_client_native_rs.workspace = true
service_utils_rs.workspace = true

# encoding
serde_json.workspace = true
http.workspace = true
serde_urlencoded = "0.7"
irpc.workspace = true

# errors and state
futures.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
sqlite_rs.workspace = true
secrets_rs.workspace = true
keyring-core = { version = "1.0", default-features = false }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
