[package]
name = "btress_sysadmin"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

# needed to fool cargo-leptos
[[bin]]
name = "fake"
path = "main.rs"

[lib]
path = "lib.rs"
crate-type = ["cdylib"]

[dependencies]
utils_rs = { path = "../utils_rs", default-features = false }

getrandom = "0.4.3"
# getrandom 0.3.x is pulled in transitively (ahash/irpc-iroh/jobserver) and
# needs the wasm_js backend for the hydrate (wasm32-unknown-unknown) build.
# Renamed dep so the feature can be gated to the `hydrate` feature only.
getrandom-03 = { package = "getrandom", version = "0.3", features = ["wasm_js"], optional = true }
serde = { version = "1", features = ["derive", "rc"] }

#
# errors
thiserror = "2"

#
# wasm
wit-bindgen = { version = "0.60.0", features = ["async-spawn"], optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true}
wasm-bindgen = { version = "0.2.126", optional = true }
wasm-bindgen-futures = { version = "0.4.76", optional = true }
# wstd = { workspace = true, optional = true }

#
# http
axum = { version = "0.8.9", default-features = false, optional = true }
axum-extra = { version = "0.12.6", default-features = false, features = ["cookie", "cookie-signed"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.7", features = ["util", "sensitive-headers", "trace"], optional = true }
http = "1"

#
# web
leptos = { version = "0.8.20" }
leptos_meta = "0.8.6"
leptos_router = "0.8.15"
wasip2 = { version = "1.0.4", optional = true }
any_spawner = { version = "0.3.0", features = ["tracing", "tokio"], optional = true }
web-sys = { version = "0.3.103", features = ["Storage", "MediaQueryList", "Window", "Request", "RequestInit", "RequestCredentials", "Response", "Headers", "SubmitEvent", "Event", "EventTarget", "HtmlFormElement", "FormData"] }

[dependencies.leptos_axum]
version = "0.8.10"
optional = true
default-features = false
# FIXME: this is a dud, "wasm" assumes running in a js wasm environment
# enabled since pre setting any_spawner::tokio makes it harmless
# and to stop eprintln warnings they've added
# but might break in the future if they do more gating around "wasm"
features = ["wasm"]

[features]
default = []
hydrate = [
    "getrandom/wasm_js",
    "dep:getrandom-03",
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
]
ssr = [
    "dep:axum",
    "dep:axum-extra",
    "dep:leptos_axum",
    "dep:wit-bindgen",
    "dep:tower",
    "dep:tower-http",
    "dep:wasip2",
    "dep:any_spawner",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[package.metadata.leptos]
tailwind-input-file = "./styles/tailwind.css"
site-root = "target/site"

lib-profile-release = "wasm-release"
lib-features = ["hydrate"]
front-target-dir = "target/front"

#
# SSR
bin-profile-release = "wasm-release"
bin-target-triple = "wasm32-wasip2"
bin-target-dir = "target/wasm"
bin-features = ["ssr"]

# Single-crate workspace: cargo-leptos assumes packages live under their workspace root
# (it failed with "Could not remove base" as a src/wasm_utils_rs member), and a standalone
# closure keeps root-workspace feature unification out of hydrate builds.
[workspace]

[profile.dev]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
debug = "line-tables-only"

[profile.wasm-release]
inherits = "release"
