[package]
name = "desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true }
ui = { workspace = true }
dayframe_app = { path = "../app" }
dayframe_settings = { path = "../micros/settings" }
dayframe_sample = { path = "../micros/sample" }
dayframe_counter = { path = "../micros/counter" }
daybook_types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

dioxus-native = { version = "0.8.0-alpha.1", features = ["scrollbars"] }
anyrender = { version = "0.13.0" }
anyrender_vello = { version = "0.14.0" }
anyrender_vello_cpu = { version = "0.17.0" }
anyrender_vello_hybrid = { version = "0.10.0" }

[target.'cfg(target_os = "linux")'.dependencies]
# Blitz disables xplat defaults; explicitly enable the Unix backend and its executor.
accesskit_xplat = "0.2.1"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]

[dev-dependencies]
blitz-dom.workspace = true
dioxus-core.workspace = true
dioxus-html.workspace = true
dioxus-native-dom.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
