[package]
name = "mobile"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["router"] }
ui = { workspace = true }

dioxus-native = { version = "0.8.0-alpha.1", features = ["scrollbars", "skia"] }
anyrender = { version = "0.13.0" }
anyrender_skia = { version = "0.11.0" }
anyrender_vello = { version = "0.14.0" }
anyrender_vello_cpu = { version = "0.17.0" }
anyrender_vello_hybrid = { version = "0.10.0" }
tokio = { version = "1", features = ["time", "rt"] }

[features]
default = ["native"]
mobile = ["dioxus/mobile"]
native = ["dioxus/native"]

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
winit = { version = "0.31.0-beta.2", features = ["android-native-activity"] }
