[package]
name = "dayframe_showcase"
version = "0.1.0"
edition = "2021"

[dependencies]
#
# internal
ui = { workspace = true }
clay_dioxus_kit = { workspace = true }
pierre_diffs_dioxus = { workspace = true }
review_mock = { workspace = true }

#
# misc
dioxus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The virtualized diff's timers: `FileDiffView` takes a sleep function, and desktop's runtime has
# a time driver.
tokio = { workspace = true, features = ["time"] }

dioxus-native.workspace = true

[dev-dependencies]
dioxus-ssr = { workspace = true }

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]

[[bin]]
name = "dayframe_showcase"
path = "main.rs"
