version = 1
role = "domain"
dependency_reason = "initial guardrail baseline"
allowed_dependencies = [
    "am_utils_rs",
    "api_utils_rs",
    "utils_rs",
]
allow_external_api_types = false

[builds.native]
required_features = ["uniffi", "wit", "schemars", "manifest"]

[builds.wasm32-wasip2]
required_features = ["wit", "schemars", "manifest"]

[api]
target = "x86_64-unknown-linux-gnu"
default_features = true
features = []

[[exemptions]]
