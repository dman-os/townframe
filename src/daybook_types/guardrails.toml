path = "src/daybook_types/lib.rs"
symbol = "module::interlude"
ceiling = 1
class = "LEGACY_DEBT"
reason = "initial guardrail baseline: export named items so interface changes have an explicit source"
reference = "docs/scratch/agent-guardrails-open-items.md"

[[exemptions]]
code = "ERROR_INLINE_TEST_MOD"
path = "src/daybook_types/manifest.rs"
symbol = "module::tests"
ceiling = 574
class = "LEGACY_DEBT"
reason = "initial guardrail baseline: move large inline #[cfg(test)] modules to a sibling file so test and production edits do not conflict"
reference = "docs/scratch/agent-guardrails-open-items.md"

[[exemptions]]
