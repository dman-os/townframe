version = 1
role = "runtime"
dependency_reason = "Binds the big_automata replay and sync protocols onto the service stack: the calling half (PeerRpcClient) rides the typed client core and its iroh transport and builds for the browser, and the serving half (the serve module, absent in the browser) hosts the part store on service_utils_rs and its native client."
allowed_dependencies = [
    "big_automata",
    "method_core",
    "service_client_core_rs",
    "service_client_iroh_rs",
    "service_client_native_rs",
    "service_core_rs",
    "service_utils_rs",
    "utils_rs",
]
allow_external_api_types = false

[api]
target = "x86_64-unknown-linux-gnu"
default_features = true
features = []

[builds.native]

# The calling half only: the serving half and its native host stack are absent on this target.
[builds.wasm32-unknown-unknown]
