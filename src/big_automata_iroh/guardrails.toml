version = 1
role = "runtime"
dependency_reason = "Hosts the big_automata replay protocol as a service: the part store is served by big_automata, and the service stack of service_utils_rs and its native client carry the calls."
allowed_dependencies = [
    "big_automata",
    "method_core",
    "service_client_core_rs",
    "service_client_iroh_rs",
    "service_client_native_rs",
    "service_utils_rs",
    "utils_rs",
]
allow_external_api_types = false

[api]
target = "x86_64-unknown-linux-gnu"
default_features = true
features = []

[builds.native]
