[package]
name = "big_automata_iroh"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[dependencies]
big_automata = { path = "../big_automata" }
method_core.workspace = true
service_core_rs.workspace = true
service_client_core_rs.workspace = true
service_client_iroh_rs.workspace = true

# The serving half (`serve`) is a native host: it sits on `service_utils_rs`'s host stack and
# its native client, whose tokio `net` and mio have no browser build. The calling half above is
# all a browser needs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
service_client_native_rs.workspace = true
service_utils_rs.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
big_automata = { path = "../big_automata", features = ["test-support"] }
service_client_native_rs = { workspace = true, features = ["iroh"] }
service_utils_rs = { workspace = true, features = ["iroh-http"] }
iroh.workspace = true
# `server` is the relay the `web_fixture` example runs for the browser e2e: plain HTTP, in process.
iroh-relay = { workspace = true, features = ["server"] }
serde_json.workspace = true
utils_rs.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
