[package]
name = "big_automata_iroh"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[features]
default = ["serve"]
# The serving half: `ReplayService` and `boot` on `service_utils_rs`'s host and a tokio timer.
# A native serving host; the browser builds the calling half alone (`default-features = false`).
serve = [
    "dep:service_client_native_rs",
    "dep:service_utils_rs",
    "dep:tokio",
]

[dependencies]
big_automata = { path = "../big_automata" }
method_core.workspace = true
service_core_rs.workspace = true
service_client_core_rs.workspace = true
service_client_iroh_rs.workspace = true
service_client_native_rs = { workspace = true, optional = true }
service_utils_rs = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time"], optional = true }

[dev-dependencies]
big_automata = { path = "../big_automata", features = ["test-support"] }
service_client_native_rs = { workspace = true, features = ["iroh"] }
service_utils_rs = { workspace = true, features = ["iroh-http"] }
iroh.workspace = true
utils_rs.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
