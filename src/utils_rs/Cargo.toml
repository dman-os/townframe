[package]
name = "utils_rs"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[features]
default = ["hash"]
hash = [
    "dep:multihash",
    "dep:json-canon",
    "dep:sha2",
    "tokio/io-util",
    "dep:blake3",
]

[dependencies]
#
# async
async-trait.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "rt", "time", "tracing"] }

#
# encoding
serde.workspace = true
serde_json.workspace = true
multihash = { workspace = true, optional = true }
data-encoding.workspace = true
bs58.workspace = true
sha2 = { version = "0.11.0", optional = true }
json-canon = { version = "0.1.3", optional = true }
blake3 = { workspace = true, optional = true }

#
# ds
# ahash = { workspace = true, optional = true }
dashmap = { version = "6.1", features = ["serde"] }
surelock.workspace = true
uuid = { version = "1", features = ["serde", "v4", "v7", "rng-getrandom"] }
indexmap = "2.14"
regex = "1"
time.workspace = true
url.workspace = true
jiff = { version = "0.2.17", features = ["serde"] }
rand.workspace = true

#
# error
thiserror.workspace = true
anyhow.workspace = true

#
# macros
displaydoc.workspace = true
educe.workspace = true
structstruck.workspace = true

# utoipa-swagger-ui = "9"

dotenv-flow.workspace = true

#
# log
tracing.workspace = true
tracing-subscriber = { workspace = true }
tracing-unwrap.workspace = true
tracing-error.workspace = true
tracing-futures.workspace = true
color-eyre.workspace = true
multibase = "0.9.2"


[target.wasm32-unknown-unknown.dependencies]
uuid = { version = "1", features = ["js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom-03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "tracing"] }
# console-subscriber = { version = "0.5.0" }
