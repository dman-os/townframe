[package]
name = "clay_inbox_spike"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# Spike: the inbox model (a long-lived async `serve` export fed by a `stream<request>`), proven
# on Wasmtime and the WCMP polyfill before the product call path adopts it. Additive and
# isolated: delete the crate (and its `x/check-dayframe.ts` entry) to drop the spike.
[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen.workspace = true
futures.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
clay_rt_wcmp = { workspace = true, features = ["test-utils"] }
futures.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
wash-runtime = { workspace = true, default-features = false }
wasmtime-wasi.workspace = true
wcmp.workspace = true
wcmp-wasm-core-wasmi.workspace = true

[lints]
workspace = true
