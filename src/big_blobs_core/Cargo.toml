[package]
name = "big_blobs_core"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[features]
schemars = ["method_core/schemars"]

[dependencies]
#
# internal
method_core.workspace = true
big_cabinet_core = { workspace = true, features = ["schemars"] }
big_sync_core = { workspace = true, default-features = false }
service_core_rs.workspace = true
macros.workspace = true

#
# misc
serde.workspace = true
serde_json.workspace = true
schemars = "1.2"
thiserror.workspace = true
bs58.workspace = true
# Not `irpc.workspace`: the workspace entry keeps irpc's default features (noq, rustls, aws-lc, which
# links ring), and a wasm guest that sends `ReadBlob` needs this crate's types to build. Feature
# unification still turns the networking features on in native builds, as in `service_core_rs`.
irpc = { version = "0.17.0", default-features = false, features = ["derive"] }
tracing.workspace = true

[dev-dependencies]
automerge.workspace = true
postcard.workspace = true
