version = 1
role = "runtime"
dependency_reason = "The cartridge registry service hosts the catalog behind the authority's capability model: it keeps one Cabinet document per cartridge in a grouped registry drawer, checks artifact bytes against the blob store before pinning them as Blob datums, and keeps the node's first-seen record of each published version in SQLite."
allowed_dependencies = [
    "big_blobs",
    "big_blobs_core",
    "big_cabinet",
    "big_cabinet_core",
    "big_cartridges_core",
    "service_client_native_rs",
    "service_utils_rs",
    "sqlite_rs",
    "utils_rs",
]
allow_external_api_types = false

[api]
target = "x86_64-unknown-linux-gnu"
default_features = true
features = []

[builds.native]

[migrations]
"src/big_cartridges/sqlite/migrations/001_registry.sql" = "8a2480f77b299f20724e539daf8e4f202692952ce57b83b0f1ab601f7bbf0058"
"src/big_cartridges/sqlite/migrations/002_cartridge_rename.sql" = "c711ce3a8b06f2c5bd0eef7292cae09d5049b922c726253901a306ea5236f752"
