[package]
name = "clay_rt_wasmtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "lib.rs"

[dependencies]
clay_docs = { workspace = true }
clay_guest_session = { workspace = true }
clay_host = { workspace = true }
clay_surface = { workspace = true }
# This crate only needs wash-runtime's `wasmtime` re-export, so it opts out of
# the default features (oci, postgres, nats, webgpu) that would otherwise reach
# `dayframe_desktop` through `clay_mdk/wasmtime`. Host crates that actually run
# washlets keep the defaults; feature unification gives them back in a
# workspace-wide build.
wash-runtime = { workspace = true, default-features = false }
wasmtime-wasi.workspace = true
futures.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
daybook_types.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
