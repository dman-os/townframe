version = 1
role = "runtime"
dependency_reason = "dayframe microkernel layering: engine-neutral contracts at the bottom, micros above them, composition roots on top"
allowed_dependencies = [
    "clay_collection",
    "clay_docs",
    "clay_guest_session",
    "clay_host",
    "clay_surface",
    "daybook_types",
]
allow_external_api_types = false

[[exemptions]]
code = "ERROR_SEND_DISCARDED"
path = "src/clay_rt_wasmtime/lib.rs"
symbol = "module::WasmPackage::from_bytes"
ceiling = 1
class = "ARCHITECTURAL_EXCEPTION"
reason = "outside a tokio runtime the compile runs on its own thread and reports through a oneshot; a closed receiver means the activation awaiting it was cancelled (the micro was disabled), so closure is the signal and the finished artifact is already cached"
reference = "AGENTS.md"
