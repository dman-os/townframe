[package]
name = "day_cli"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[[bin]]
name = "day"
path = "main.rs"

[dependencies]
#
# internal
method_core.workspace = true
utils_rs.workspace = true
secrets_rs.workspace = true
service_utils_rs.workspace = true
big_node.workspace = true
big_node_holder.workspace = true
big_nodule_core.workspace = true
big_cabinet_core = { workspace = true, features = ["manifest"] }

#
# cli
clap = { workspace = true, features = ["derive", "env", "string"] }
clap_complete.workspace = true

#
# async
tokio = { workspace = true, features = ["rt-multi-thread", "fs", "time", "sync", "signal", "net", "process", "io-util"] }

#
# error
tracing.workspace = true

#
# encoding
serde = { workspace = true }
serde_json.workspace = true
data-encoding.workspace = true

#
# fs and os
libc = "0.2"

[dev-dependencies]
#
# internal
secrets_rs = { workspace = true, features = ["test-support"] }
big_node_holder = { workspace = true, features = ["test-support"] }

#
# misc
trycmd = "1.2.1"
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
