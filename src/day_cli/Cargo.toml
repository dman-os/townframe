[package]
name = "day_cli"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[[bin]]
name = "day"
path = "main.rs"

[dependencies]
method_core.workspace = true
#
# internal
utils_rs.workspace = true
sqlite_rs.workspace = true
secrets_rs.workspace = true
service_client_core_rs.workspace = true
service_client_native_rs.workspace = true
service_utils_rs.workspace = true
big_node.workspace = true
big_dispatch.workspace = true
big_dispatch_core.workspace = true
big_nodule_core.workspace = true
big_repo.workspace = true
big_blobs_core = { path = "../big_blobs_core" }
big_cabinet = { path = "../big_cabinet" }
big_cabinet_core = { path = "../big_cabinet_core" }
intxt_capture = { path = "../intxt_capture" }
intxt_core = { path = "../intxt_core", features = ["cartridge", "client"] }

#
# cli
clap = { workspace = true, features = ["derive", "env", "string"] }
clap_complete.workspace = true

#
# async
tokio = { workspace = true, features = ["rt-multi-thread", "fs", "time", "sync", "signal", "net", "process", "io-util"] }

#
# http, to serve the router in process without a socket
axum = { workspace = true }
http.workspace = true
serde_urlencoded = "0.7"
tower = { workspace = true, features = ["util"] }

#
# error
tracing.workspace = true

#
# encoding
serde = { workspace = true }
serde_json.workspace = true
data-encoding.workspace = true

#
# crypto
rand.workspace = true

#
# fs and os
directories.workspace = true
libc = "0.2"

[dev-dependencies]
trycmd = "1.2.1"
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
secrets_rs = { workspace = true, features = ["test-support"] }
