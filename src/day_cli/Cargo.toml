[package]
name = "day_cli"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
# The hidden `day docs` command that renders the man pages and the Markdown reference from the clap
# definitions (`cargo x cli`). Off by default so that ordinary builds do not pay for it.
docs = ["dep:clap_mangen", "dep:clap-markdown"]

[[bin]]
name = "day"
path = "main.rs"

[dependencies]
#
# internal
method_core.workspace = true
utils_rs.workspace = true
sqlite_rs.workspace = true
secrets_rs.workspace = true
service_client_core_rs.workspace = true
service_utils_rs.workspace = true
big_node.workspace = true
big_dispatch.workspace = true
big_dispatch_core.workspace = true
big_nodule_core.workspace = true
# `test-support` for the fixture namespace intxt's cartridge sits under, which signs it.
big_cartridges_core = { workspace = true, features = ["test-support"] }
big_repo.workspace = true
big_blobs_core.workspace = true
big_cabinet.workspace = true
big_cabinet_core = { workspace = true, features = ["manifest"] }
intxt_capture.workspace = true
intxt_core = { workspace = true, features = ["install"] }
short_ids.workspace = true

#
# cli
clap = { workspace = true, features = ["derive", "env", "string"] }
clap_complete.workspace = true
clap_mangen = { workspace = true, optional = true }
clap-markdown = { workspace = true, optional = true }
# build info for `day --version`: the commit, the branch and when it was built
shadow-rs = { workspace = true, features = ["build"] }

#
# async
tokio = { workspace = true, features = ["rt-multi-thread", "fs", "time", "sync", "signal", "net", "process", "io-util"] }

#
# http, to serve the router in process without a socket
axum = { workspace = true }
http.workspace = true
reqwest.workspace = true
tokio-util = { workspace = true, features = ["io"] }
futures.workspace = true
serde_urlencoded = "0.7"
tower = { workspace = true, features = ["util"] }

#
# error
tracing.workspace = true
thiserror.workspace = true

#
# encoding
serde = { workspace = true }
serde_json.workspace = true
data-encoding.workspace = true

#
# crypto
rand.workspace = true

#
# fs and os
directories.workspace = true
tempfile.workspace = true
libc = "0.2"

[build-dependencies]
shadow-rs = { workspace = true, features = ["build"] }

[dev-dependencies]
#
# internal
secrets_rs = { workspace = true, features = ["test-support"] }
big_blobs_core.workspace = true

#
# misc
trycmd = "1.2.1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
