[package]
name = "wflow"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[features]
default = ["test-harness"]
test-harness = []

[dependencies]
# internal
wflow_core = { workspace = true, features = ["test-harness"] }
wflow_tokio.workspace = true
wflow_wdk.workspace = true
wash_plugin_wflow.workspace = true
utils_rs = { workspace = true, features = ["hash"] }

# async
async-trait.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "fs"] }

# db
sqlite_rs.workspace = true

[dev-dependencies]
serde.workspace = true
tempfile.workspace = true
