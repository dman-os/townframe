[package]
name = "wflow"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[dependencies]
# internal
wflow_core.workspace = true
wflow_tokio.workspace = true
wflow_wdk.workspace = true
wash_plugin_wflow.workspace = true
utils_rs = { workspace = true, features = ["hash"] }

# async
async-trait.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "fs"] }

# db
sqlite_rs.workspace = true

[dev-dependencies]
wflow_core = { workspace = true, features = ["test-harness"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
wash-runtime = { workspace = true, default-features = true }
wasmtime.workspace = true
