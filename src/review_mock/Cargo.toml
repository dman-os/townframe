[package]
name = "review_mock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "lib.rs"

[lints]
workspace = true

[dependencies]
#
# internal
clay_dioxus_kit = { workspace = true }
pierre_diffs_dioxus = { workspace = true }

#
# misc
# Spelled out (not `dioxus.workspace = true`) so default features stay off: the wasip3 guest
# build has no renderer or launcher to link, like `clay_dioxus_kit`.
dioxus = { git = "https://github.com/dman-os/dioxus", rev = "49e05de24022388ee0e36802edf59897dbe41db3", default-features = false, features = ["macro", "signals", "hooks", "html"] }

[dev-dependencies]
dioxus-ssr = { workspace = true }
