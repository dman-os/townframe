[package]
name = "big_cabinet_core"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
name = "big_cabinet_core"
path = "lib.rs"
crate-type = ["rlib"]

[features]
default = ["manifest"]
schemars = ["dep:schemars", "datum_core/schemars", "method_core/schemars", "big_sync_core/schemars"]
manifest = []

[dependencies]
#
# internal
method_core.workspace = true
big_sync_core = { workspace = true, default-features = false }
datum_core = { workspace = true, features = ["jiff", "automerge"] }
utils_rs = { workspace = true, features = ["hash"] }
service_core_rs.workspace = true
macros.workspace = true

#
# misc
serde.workspace = true
serde_json.workspace = true
data-encoding.workspace = true
# git's object id, which a content-addressed datum's slot is (ADR 035 §2.9).
sha1 = "0.10"
json-canon = "0.1.3"
# An instant is stored as milliseconds and written as RFC 3339, and jiff is what a schema in this tree
# states one with.
jiff.workspace = true
# `datum::Extra` keeps the field order a peer sent; `serde_json::Map` is a `BTreeMap` here.
indexmap = { version = "2", features = ["serde"] }
schemars = { version = "1.2", features = ["jiff02", "indexmap2", "uuid1"], optional = true }
thiserror.workspace = true
jsonschema = { version = "0.42.0", default-features = false }
displaydoc.workspace = true
unicode-properties = { version = "=0.1.1", default-features = false, features = ["general-category"] }
unicode-segmentation = "=1.13.3"
autosurgeon = { workspace = true, features = ["uuid"] }
automerge = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7"] }
irpc = { workspace = true, default-features = false, features = ["derive", "rpc", "spans"] }
tracing.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
coset = "0.4.2"
ciborium = "0.2.2"
# The `datum` macro joins a member's const authority to its name in a const.

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
