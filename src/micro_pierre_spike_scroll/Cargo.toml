[package]
name = "micro_pierre_spike_scroll"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
# P5: also export `p5_init`/`p5_bench`/`p5_len` as plain core functions so the unbundled core
# module can be instantiated and timed in V8 outside wcmp (`src/micro_pierre_spike_scroll/p5/`).
p5-direct = []

[dependencies]
micro_layout_manifest = { workspace = true }
serde_json.workspace = true
dioxus-core.workspace = true
dioxus = { git = "https://github.com/dman-os/dioxus", rev = "a3e1e68334b7dfa68cead38e9e8795ec7a6b534a", default-features = false, features = ["macro", "signals", "hooks", "html"] }

[target.'cfg(target_os = "wasi")'.dependencies]
clay_mdk = { workspace = true, features = ["guest", "spike-phases"] }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
clay_mdk = { workspace = true, features = ["in_process", "view"] }

[dev-dependencies]
clay_surface = { workspace = true }
