version = 1
role = "runtime"
dependency_reason = "The composition seam between a Clay micro and the node: it answers a micro's dispatch.local requests through the nodule egress as the micro's own actor, so micros and nodules reach dispatch the same way."
allowed_dependencies = [
    "big_cabinet",
    "big_cabinet_core",
    "big_dispatch",
    "big_dispatch_core",
    "big_nodule",
    "clay_guest_session",
    "clay_host",
    "clay_rt_wasmtime",
    "clay_surface",
    "secrets_rs",
    "service_client_native_rs",
    "service_core_rs",
    "service_utils_rs",
    "sqlite_rs",
]
allow_external_api_types = false

[api]
target = "x86_64-unknown-linux-gnu"
default_features = true
features = []

[builds.native]
