[package]
name = "micro_sample"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[dependencies]
clay_mdk = { path = "../clay_mdk", default-features = false, features = ["native"] }
micro_settings_manifest = { path = "../micro_settings_manifest" }
dioxus.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
clay_compose = { path = "../clay_compose" }
clay_dioxus = { path = "../clay_dioxus" }
micro_settings = { path = "../micro_settings" }
tokio = { workspace = true, features = ["rt", "macros"] }
