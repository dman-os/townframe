[package]
name = "method_core"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[features]
# Host-only: the request, output and error schemas a method's Lexicon is projected from. A wasm
# guest never enables it; the declarations crate a guest's native `build.rs` links does.
schemars = ["dep:schemars", "dep:serde_json"]

[dependencies]
futures.workspace = true
serde.workspace = true
thiserror.workspace = true
schemars = { version = "1.2", optional = true }
serde_json = { workspace = true, optional = true }
