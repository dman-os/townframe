[package]
name = "micro_counter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
clay_mdk = { path = "../clay_mdk", default-features = false, features = ["wit", "dioxus"] }
micro_counter_manifest = { path = "../micro_counter_manifest" }
dioxus = { workspace = true, default-features = false, features = ["macro", "signals", "hooks", "html"] }
serde_json.workspace = true
