[package]
name = "micro_counter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
micro_counter_manifest = { workspace = true }
dioxus = { git = "https://github.com/dman-os/dioxus", rev = "4ef345c24e3d92b4b006467618b3a6d20d0a74e2", default-features = false, features = ["macro", "signals", "hooks", "html"] }

# One authored micro, two backends (isomorphic MDK): a wasm32-wasip3 build is the guest, every
# other target links the in-process backend (the browser shell hosts native micros on
# wasm32-unknown-unknown).
[target.'cfg(target_os = "wasi")'.dependencies]
clay_mdk = { workspace = true, features = ["guest"] }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
clay_mdk = { workspace = true, features = ["in_process", "view"] }

[dev-dependencies]
ciborium.workspace = true
clay_dioxus = { workspace = true }
clay_guest_session = { workspace = true }
clay_host = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
