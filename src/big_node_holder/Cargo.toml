[package]
name = "big_node_holder"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[features]
# `NodeDir::with_socket_dir`, so a test places the socket outside the real runtime directory.
test-support = []

[dependencies]
#
# internal
utils_rs.workspace = true
sqlite_rs.workspace = true
secrets_rs.workspace = true
big_node.workspace = true
big_dispatch.workspace = true
big_repo.workspace = true
big_cabinet.workspace = true
big_cabinet_core = { workspace = true, features = ["manifest"] }
method_core.workspace = true

#
# async
tokio = { workspace = true, features = ["rt-multi-thread", "fs", "time", "sync", "net", "io-util"] }

#
# http, to serve the router in process without a socket
axum = { workspace = true }
http.workspace = true
reqwest.workspace = true
serde_urlencoded = "0.7"
tower = { workspace = true, features = ["util"] }

#
# encoding
serde = { workspace = true }
serde_json.workspace = true
data-encoding.workspace = true

#
# crypto
rand.workspace = true

#
# fs and os
directories.workspace = true
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
