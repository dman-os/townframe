[package]
name = "micro_settings_manifest"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[dependencies]
#
# internal
clay_mdk = { workspace = true, features = ["contract"] }
micro_shell_manifest = { workspace = true }

#
# misc
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
# `host::declared_rows` checks the declared rows in tests; the contract itself stays backend-free
# so a guest that contributes rows (the counter) never links the in-process backend.
clay_mdk = { workspace = true, features = ["in_process"] }
ciborium.workspace = true
insta.workspace = true
