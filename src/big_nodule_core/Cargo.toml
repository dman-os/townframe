[package]
name = "big_nodule_core"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
name = "big_nodule_core"
path = "lib.rs"
crate-type = ["rlib"]

[features]
default = []
schemars = ["dep:schemars", "big_cabinet_core/schemars", "big_plugs_core/schemars"]

[dependencies]
big_cabinet_core = { path = "../big_cabinet_core", default-features = false }
big_plugs_core = { path = "../big_plugs_core", default-features = false }
macros = { path = "../macros" }
service_core_rs = { path = "../service_core_rs" }
# `declare_service_protocol!` expands to `irpc` derives that name both crates directly.
irpc.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `Extra`, carried Lexicon files and trigger policies keep the member order a peer sent.
indexmap = { version = "2", features = ["serde"] }
schemars = { version = "1.2", features = ["indexmap2"], optional = true }
