[package]
name = "big_nodule_core"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
name = "big_nodule_core"
path = "lib.rs"
crate-type = ["rlib"]

[features]
default = []
schemars = ["dep:schemars", "big_cabinet_core/schemars", "big_cartridges_core/schemars", "big_dispatch_core/schemars", "method_core/schemars"]

[dependencies]
method_core.workspace = true
big_blobs_core.workspace = true
big_cabinet_core.workspace = true
big_dispatch_core.workspace = true
big_cartridges_core.workspace = true
macros.workspace = true
service_core_rs.workspace = true
# `declare_service_protocol!` expands to `irpc` derives that name both crates directly.
irpc.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `Extra`, carried Lexicon files and trigger policies keep the member order a peer sent.
indexmap = { version = "2", features = ["serde"] }
schemars = { version = "1.2", features = ["indexmap2"], optional = true }

[dev-dependencies]
big_cartridges_core = { workspace = true, features = ["test-support"] }
