[package]
name = "clay_dioxus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "lib.rs"

[dependencies]
clay_host = { workspace = true }
clay_surface = { workspace = true }
dioxus.workspace = true
dioxus-html.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
dioxus-core.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

# Pierre scroll spike: `window.__clayTiming` records of the host's per-revision phases, read by
# the Playwright spec. Browser builds only; off everywhere else.
[features]
spike-timing = []
spike-raised-limits = ["clay_surface/spike-raised-limits"]

# The browser is the only host here with a frame source, which the scroll coalescer (`frames.rs`)
# and the timing records (`timing.rs`) use.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-sys = { workspace = true, features = ["Window", "Performance", "Document", "Element", "Node", "NodeList", "Text", "HtmlElement", "CssStyleDeclaration", "Event", "EventTarget", "DocumentFragment", "AddEventListenerOptions"] }
js-sys.workspace = true
wasm-bindgen.workspace = true
