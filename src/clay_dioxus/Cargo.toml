[package]
name = "clay_dioxus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "lib.rs"

[features]
wasmtime = ["dep:clay_engine_wasmtime"]

[dependencies]
clay_engine_wasmtime = { path = "../clay_engine_wasmtime", optional = true }
clay_compose = { path = "../clay_compose" }
clay_data = { path = "../clay_data" }
clay_host = { path = "../clay_host" }
clay_surface = { path = "../clay_surface" }
daybook_types = { workspace = true, default-features = false, features = ["manifest"] }
dioxus.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
dioxus-core.workspace = true
dioxus-html.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
