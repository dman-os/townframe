[package]
name = "pierre_diffs_dioxus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "lib.rs"

[dependencies]
pierre_diffs = { workspace = true }
# Spelled out (not `dioxus.workspace = true`) so default features stay off, as in
# `clay_dioxus_kit`: the diff view needs the macro, signals, hooks and element vocabulary only,
# never a renderer or launcher, so it links into native, browser and wasm guest builds alike.
dioxus = { git = "https://github.com/dman-os/dioxus", rev = "ba8feef7fb2bce7efd06ea65a12d02af33598706", default-features = false, features = ["macro", "signals", "hooks", "html"] }

[dev-dependencies]
dioxus-ssr.workspace = true
insta.workspace = true

[lints]
workspace = true
