[package]
name = "micro_layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
clay_dioxus_kit = { workspace = true }
micro_layout_manifest = { workspace = true }
dioxus = { git = "https://github.com/dman-os/dioxus", rev = "7f6251d8070f39e46cff33712395077a9606a43c", default-features = false, features = ["macro", "signals", "hooks", "html"] }

# One authored micro, two backends (isomorphic MDK): a wasm32-wasip3 build is the guest, every
# other target links the in-process backend.
[target.'cfg(target_os = "wasi")'.dependencies]
clay_mdk = { workspace = true, features = ["guest"] }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
clay_mdk = { workspace = true, features = ["in_process", "view"] }

[dev-dependencies]
dioxus-core = { workspace = true }

[lints]
workspace = true
