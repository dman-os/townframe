[package]
name = "micro_review"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
# The in-memory fixture node, for tests and standalone labs; the shipped guest leaves it out.
fixture = []

[dependencies]
#
# internal
big_blobs_core = { workspace = true }
big_cabinet_core = { workspace = true }
clay_dioxus_kit = { workspace = true }
intxt_core = { workspace = true }
method_core = { workspace = true }
micro_review_manifest = { workspace = true }
pierre_diffs_dioxus = { workspace = true }
#
# external
dioxus = { git = "https://github.com/dman-os/dioxus", rev = "49e05de24022388ee0e36802edf59897dbe41db3", default-features = false, features = ["macro", "signals", "hooks", "html"] }
futures.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# One authored micro, two backends (isomorphic MDK): a wasm32-wasip3 build is the guest, every
# other target links the in-process backend (the browser shell hosts native micros on
# wasm32-unknown-unknown).
[target.'cfg(target_os = "wasi")'.dependencies]
clay_mdk = { workspace = true, features = ["guest"] }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
clay_mdk = { workspace = true, features = ["in_process", "view"] }

[dev-dependencies]
dioxus-ssr = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
