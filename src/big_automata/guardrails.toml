version = 1
role = "domain"
dependency_reason = "The sans-io sync machines and their store contracts build on the shared ids, prelude and hashing in utils_rs; the replay protocol declares its methods and protocol with service_core_rs and method_core."
allowed_dependencies = ["method_core", "service_core_rs", "utils_rs"]
allow_external_api_types = false

[api]
target = "x86_64-unknown-linux-gnu"
default_features = true
features = ["automerge"]

[builds.native]
features = ["automerge", "test-support"]
required_features = []
default_features = true

[builds.wasm32-unknown-unknown]
features = ["automerge"]
required_features = []
default_features = true

[builds.wasm32-wasip3]
features = ["automerge"]
required_features = []
default_features = true

[[exemptions]]
code = "ERROR_GLOB_EXPORT"
path = "src/big_automata/lib.rs"
symbol = "module::interlude"
ceiling = 2
class = "LEGACY_DEBT"
reason = "initial guardrail baseline: export named items so interface changes have an explicit source"
reference = "docs/scratch/agent-guardrails-open-items.md"

[[exemptions]]
code = "ERROR_LINT_REASON"
path = "src/big_automata/fingerprint.rs"
symbol = "module::FingerprintSeed as serde :: Deserialize < 'de >::deserialize::SeedVisitor as serde :: de :: Visitor < 'de >::visit_bytes"
ceiling = 1
class = "LEGACY_DEBT"
reason = "initial guardrail baseline: copied from subduction's fingerprint module"
reference = "docs/scratch/agent-guardrails-open-items.md"
