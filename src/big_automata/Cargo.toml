[package]
name = "big_automata"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[features]
default = ["automerge"]
automerge = ["dep:autosurgeon"]
# exports the okv oracle and law harness so other okv backends run the same laws
test-support = ["dep:proptest"]

[dependencies]
utils_rs = { workspace = true, features = ["hash"] }
method_core.workspace = true
service_core_rs.workspace = true

structstruck.workspace = true

#
# os
rand.workspace = true
# `Instant` that is std's on native targets and readable on wasm32-unknown-unknown
web-time.workspace = true

#
# error
thiserror.workspace = true

#
# async
# tokio-util.workspace = true
tokio = { workspace = true, features = ["sync"] }
surelock.workspace = true
async-channel.workspace = true
async-trait.workspace = true
# The driver spawns and sleeps through it: tokio natively, the browser's event loop on wasm.
n0-future.workspace = true
# `futures::future::select` races the replay responder's hold against its timer
futures.workspace = true

#
# encoding
blake3.workspace = true
json-canon.workspace = true
bs58.workspace = true
serde.workspace = true
autosurgeon = { workspace = true, optional = true }
siphasher.workspace = true
ciborium.workspace = true

#
# logging
tracing.workspace = true

#
# test-support
# Without proptest's defaults: `fork` and `timeout` pull in `wait-timeout`, which has no
# wasm32-unknown-unknown build, and the browser host (`big_automata_web`) takes `test-support`
# for the memory backend.
proptest = { version = "1.12", default-features = false, features = ["std", "bit-set"], optional = true }

[dev-dependencies]
postcard.workspace = true
proptest.workspace = true
serde_json.workspace = true
# The driver's tests run on a paused clock.
tokio = { workspace = true, features = ["sync", "macros", "rt", "time", "test-util"] }

# `rand` pulls in getrandom 0.3. On the web, `.cargo/config.toml` selects its `wasm_js`
# backend, which only compiles with the feature of the same name turned on.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom03 = { workspace = true, features = ["wasm_js"] }

# `declare_service_protocol!` expands to `irpc::` paths in the caller. Natively the protocol enum
# carries irpc's remote half (`rpc`); in the browser irpc has no QUIC transport and the macro
# emits the in-process half only. Not `irpc.workspace`: its default features (noq, rustls,
# aws-lc) do not build for wasm.
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
irpc = { version = "0.17.0", default-features = false, features = ["derive", "spans", "rpc"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
irpc = { version = "0.17.0", default-features = false, features = ["derive", "spans"] }

# Instruction-count benches (see `benches/instr.rs` and the benchmarking skill). Valgrind has no
# wasm build, so the dependency is native only and the target is empty on wasm.
[[bench]]
name = "instr"
harness = false

[[bench]]
name = "wall"
harness = false
required-features = ["test-support"]

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
gungraun = "0.20.0"
divan = "0.1.21"
uuid.workspace = true

# Which tiers `x/bench.ts` runs for this crate: `counts` is a nextest filter over tests that
# print `BENCH_RECORD` lines (allocation counts, simulated time); `instr` and `wall` name bench
# targets.
[package.metadata.bench]
counts = { filter = "test(/scaling::|whole_sync_costs|outbox_configuration_sweep/)", features = ["test-support"] }
instr = { bench = "instr" }
wall = { bench = "wall", features = ["test-support"] }
