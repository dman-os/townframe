[package]
name = "big_automata"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[features]
default = ["automerge"]
automerge = ["dep:autosurgeon"]
# exports the okv oracle and law harness so other okv backends run the same laws
test-support = ["dep:proptest"]

[dependencies]
utils_rs = { workspace = true, features = ["hash"] }

structstruck.workspace = true

#
# os
rand.workspace = true
# `Instant` that is std's on native targets and readable on wasm32-unknown-unknown
web-time.workspace = true

#
# error
thiserror.workspace = true

#
# async
# tokio-util.workspace = true
tokio = { workspace = true, features = ["sync"] }
surelock.workspace = true
async-channel.workspace = true
async-trait.workspace = true
future_form.workspace = true
# `#[future_form]` expands to `::futures::future::{BoxFuture, LocalBoxFuture}`
futures.workspace = true

#
# encoding
blake3.workspace = true
json-canon.workspace = true
bs58.workspace = true
serde.workspace = true
autosurgeon = { workspace = true, optional = true }
siphasher.workspace = true
ciborium.workspace = true

#
# logging
tracing.workspace = true

#
# test-support
proptest = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

# `rand` pulls in getrandom 0.3. On the web, `.cargo/config.toml` selects its `wasm_js`
# backend, which only compiles with the feature of the same name turned on.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom03 = { workspace = true, features = ["wasm_js"] }
