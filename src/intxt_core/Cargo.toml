[package]
name = "intxt_core"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

# `#[macros::datum]` emits open vocabularies' JSON Schema under this crate's `schemars` feature,
# and a vocabulary crate always needs its schemas.
[features]
default = ["schemars"]
# Also the schemas the methods' Lexicons are projected from: `methods!` and the derives test this
# crate's own feature.
schemars = ["method_core/schemars"]
# Host-only: the cartridge builder (`intxt_core::cartridge`), which admits these vocabularies and
# the nodule's methods to a node. A wasm guest never enables it.
cartridge = ["schemars", "dep:big_cartridges_core", "big_cartridges_core/test-support", "dep:big_nodule_core", "dep:indexmap", "dep:method_lexicon"]

# The client library (`intxt_core::client`): the recorder and the cabinet caller `createIntxt`,
# `addToIntxt` and `intxt capture` share. It speaks XRPC over a caller-supplied `HttpTransport`, so
# it builds for a wasm guest as well as the host.
client = ["dep:blake3", "dep:service_client_core_rs", "dep:service_core_rs"]

[dependencies]
#
# internal
big_cabinet_core = { workspace = true, features = ["schemars"] }
macros.workspace = true
method_core.workspace = true
service_client_core_rs = { workspace = true, optional = true }
service_core_rs = { workspace = true, optional = true }
#
# external
automerge.workspace = true
blake3 = { workspace = true, optional = true }
jiff.workspace = true
schemars = "1.2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# The cartridge builder is host-only (`cartridge` feature); a wasm guest never links it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
#
# internal
big_cartridges_core = { workspace = true, optional = true }
big_nodule_core = { workspace = true, optional = true }
method_lexicon = { workspace = true, optional = true }
#
# external
indexmap = { version = "2", features = ["serde"], optional = true }

[dev-dependencies]
