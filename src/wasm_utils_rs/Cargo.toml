[package]
name = "wasm_utils_rs"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[dependencies]
utils_rs.workspace = true
serde.workspace = true
wit-bindgen.workspace = true

[workspace]
resolver = "3"
members = [".", "../plug_test_routines", "../plug_plabels_routines", "../plug_dayledger_routines", "../test_wflows"]
default-members = [".", "../plug_test_routines", "../plug_plabels_routines", "../plug_dayledger_routines", "../test_wflows"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[workspace.dependencies]
wasm_utils_rs = { path = "." }
plug_test_manifest = { path = "../plug_test_manifest" }
plug_plabels_manifest = { path = "../plug_plabels_manifest" }
plug_dayledger_manifest = { path = "../plug_dayledger_manifest" }
utils_rs = { path = "../utils_rs", default-features = false }
am_utils_rs = { path = "../am_utils_rs", default-features = false }
daybook_types = { path = "../daybook_types", default-features = false }
daybook_pdk = { path = "../daybook_pdk", default-features = false }
wflow_sdk = { path = "../wflow_sdk", default-features = false }
daybook_core = { path = "../daybook_core", default-features = false }
sqlite_rs = { path = "../sqlite_rs", default-features = false }
automerge = "0.11.0"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
url = { version = "2.5.7", features = ["serde"] }
blake3 = "1.8"
pastey = "0.1"
color-eyre = "0.6"
thiserror = "2"
wit-bindgen = "0.60.0"
tokio = { version = "1.51", default-features = false }
axum = { version = "0.8.9", default-features = false }
axum-extra = { version = "0.12.6", default-features = false }
tower = "0.5"
tower-http = "0.7"
http = "1"

[workspace.lints]
clippy.clone_on_ref_ptr = "warn"
clippy.let_underscore_must_use = "warn"
clippy.let_underscore_untyped = "deny"
rust.let_underscore_drop = "deny"

[patch.crates-io]
autosurgeon = { git = "https://github.com/dman-os/autosurgeon", rev = "6a1df66f667667f1d14bc2272c4d426815de66b8" }
autosurgeon-derive = { git = "https://github.com/dman-os/autosurgeon", rev = "6a1df66f667667f1d14bc2272c4d426815de66b8" }

[profile.dev]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
debug = "line-tables-only"

[profile.wasm-release]
inherits = "release"
