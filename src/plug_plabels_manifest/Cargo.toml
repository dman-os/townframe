[package]
name = "plug_plabels_manifest"
version.workspace = true
edition.workspace = true

[package.metadata.townframe]
routines = "../plug_plabels_routines"

[package.metadata.cargo-machete]
ignored = ["serde"]

[lints]
workspace = true

[lib]
path = "lib.rs"

[[bin]]
name = "manifest"
path = "manifest.rs"

[dependencies]
utils_rs = { workspace = true, default-features = false }
daybook_types = { workspace = true, default-features = false, features = ["manifest", "schemars"] }
serde.workspace = true
serde_json.workspace = true
schemars = { version = "1.2", features = [
    "uuid1",
    "semver1",
    "url2",
    "jiff02",
    "indexmap2",
] }

[dev-dependencies]
daybook_core = { workspace = true, features = ["test-support"] }
