version = 1
role = "interface"
dependency_reason = "initial guardrail baseline"
allowed_dependencies = ["wflow_sdk"]
allow_external_api_types = false

[builds.native]

[builds.wasm32-wasip3]

[api]
target = "x86_64-unknown-linux-gnu"
default_features = true
features = []

[[exemptions]]
code = "ERROR_LINT_REASON"
path = "src/daybook_pdk/lib.rs"
symbol = "module::interlude"
ceiling = 1
class = "LEGACY_DEBT"
reason = "initial guardrail baseline: give the lint expectation a nonempty reason"
reference = "docs/scratch/agent-guardrails-open-items.md"

[[exemptions]]
code = "ERROR_DEPENDENCY_GROUP"
path = "src/daybook_pdk/Cargo.toml"
symbol = "dependency-groups"
ceiling = 1
class = "LEGACY_DEBT"
reason = "internal crates are not yet grouped under a `#` / `# internal` comment header: move them into one group at the top of each dependency table"
reference = "docs/scratch/nodule-runtime-ledger.md"
