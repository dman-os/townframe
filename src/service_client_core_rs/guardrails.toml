version = 1
role = "interface"
dependency_reason = "The typed service client core is the call API, the transport traits and the XRPC envelope codec over the service-core message contracts; it holds no I/O so guests and native hosts share it."
allowed_dependencies = ["method_core", "service_core_rs"]
allow_external_api_types = false

[api]
target = "x86_64-unknown-linux-gnu"
default_features = true
features = []

[builds.native]

[builds.wasm32-unknown-unknown]

[builds.wasm32-wasip3]
