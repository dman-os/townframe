[package]
name = "big_cartridges_core"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
name = "big_cartridges_core"
path = "lib.rs"
crate-type = ["rlib"]

[features]
default = []
schemars = ["dep:schemars", "big_cabinet_core/schemars", "method_core/schemars"]
test-support = []

[dependencies]
method_core.workspace = true
big_blobs_core.workspace = true
big_cabinet_core.workspace = true
macros.workspace = true
service_core_rs.workspace = true
# `declare_service_protocol!` expands to `irpc` derives that name both crates directly.
irpc.workspace = true
tracing.workspace = true
utils_rs = { workspace = true, features = ["hash"] }
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
thiserror.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
json-canon = "0.1.3"
# `Extra` and carried contribution descriptions keep the member order a peer sent.
indexmap = { version = "2", features = ["serde"] }
schemars = { version = "1.2", features = ["indexmap2"], optional = true }
