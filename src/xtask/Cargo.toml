[package]
name = "xtask"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[[bin]]
name = "xtask"
path = "main.rs"

[dependencies]
blake3.workspace = true
clap = { workspace = true, features = ["derive", "env"] }

dotenv-flow.workspace = true

utils_rs = { workspace = true, default-features = false }
sqlite_rs.workspace = true
rusqlite = { version = "0.32", features = ["column_decltype"] }
tempfile.workspace = true

tokio = { workspace = true, features = ["rt-multi-thread", "fs", "time", "tracing", "process"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# sql codegen & guardrails
heck = "0.5.0"
proc-macro2 = { version = "1", features = ["span-locations"] }
pulldown-cmark = { version = "0.13", default-features = false }
quote = "1"
syn = { workspace = true, features = ["full", "visit", "extra-traits"] }
toml = "0.9"
walkdir = "2"

oci-spec = "0.8.4"
sha2 = "0.10.9"
url.workspace = true
