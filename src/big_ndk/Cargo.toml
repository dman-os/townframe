[package]
name = "big_ndk"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[dependencies]
method_core.workspace = true
service_core_rs.workspace = true
service_client_core_rs.workspace = true
http.workspace = true
serde_json.workspace = true
# The workspace pins wit-bindgen with default features off (the `std` feature breaks per-task
# export state, see the root Cargo.toml), so the generator and async runtime are named here.
wit-bindgen = { workspace = true, features = ["macros", "realloc", "async", "async-spawn", "futures-stream", "inter-task-wakeup"] }

[dev-dependencies]
futures.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

# The wasm32-wasip3 build selects getrandom's `custom` backend (see `.cargo/config.toml`), which
# a guest binary supplies: `wasi.rs` does, from `wasi:random`, for every nodule at once.
[target.wasm32-wasip3.dependencies]
getrandom03.workspace = true
