version = 1
role = "interface"
dependency_reason = "The nodule development kit: the handler trait, per-call context and wasi:http export a nodule author builds on. It speaks the XRPC envelope through the shared service-core and client-core crates and holds the one wasi:http binding, so a guest depends on this crate alone."
allowed_dependencies = ["method_core", "service_client_core_rs", "service_core_rs"]
allow_external_api_types = false

[api]
target = "x86_64-unknown-linux-gnu"
default_features = true
features = []

[builds.native]

[builds.wasm32-wasip3]
