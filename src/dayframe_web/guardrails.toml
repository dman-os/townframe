version = 1
role = "application"
dependency_reason = "dayframe microkernel layering: engine-neutral contracts at the bottom, micros above them, composition roots on top"
allowed_dependencies = [
    "clay_dioxus",
    "clay_mdk",
    "clay_rt_wcmp",
    "clay_rt_wcmp_web",
    "clay_store",
    "dayframe_composition",
    "clay_docs",
    "micro_counter_manifest",
    "micro_sample",
    "micro_settings",
    "micro_settings_manifest",
    "micro_shell",
    "micro_shell_manifest",
    "micro_toolbar",
    "micro_toolbar_manifest",
    "ui",
]
allow_external_api_types = false

# Web shell: engine-neutral composition + `wcmp` guest fetch (ADR 018 §7). The shell is
# meaningless without the `web` renderer feature, so the matrix never builds it bare.
[builds.wasm32-unknown-unknown]
features = ["web"]
required_features = ["web"]
[[exemptions]]
code = "ERROR_DEPENDENCY_GROUP"
path = "src/dayframe_web/Cargo.toml"
symbol = "dependency-groups"
ceiling = 14
class = "LEGACY_DEBT"
reason = "internal crates are not yet grouped under a `#` / `# internal` comment header: move them into one group at the top of each dependency table"
reference = "docs/scratch/nodule-runtime-ledger.md"
