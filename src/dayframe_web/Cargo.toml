[package]
name = "dayframe_web"
version = "0.1.0"
edition = "2021"

[target.'cfg(target_arch = "wasm32")'.dependencies]
#
# internal
ui = { workspace = true }
dayframe_composition = { workspace = true }
clay_dioxus = { workspace = true }
clay_mdk = { workspace = true, features = ["in_process", "view", "wcmp", "package"] }
clay_rt_wcmp = { workspace = true }
clay_store = { workspace = true }
clay_rt_wcmp_web = { workspace = true }
micro_settings = { workspace = true }
micro_settings_manifest = { workspace = true }
micro_shell = { workspace = true }
micro_shell_manifest = { workspace = true }
micro_toolbar = { workspace = true }
micro_toolbar_manifest = { workspace = true }
micro_sample = { workspace = true }
micro_counter_manifest = { workspace = true }
clay_docs = { workspace = true }

#
# misc
dioxus = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Response", "Document", "Element", "History", "Event", "EventTarget", "PopStateEvent"] }
console_error_panic_hook = "0.1.7"

[features]
default = ["web"]
web = ["dioxus/web"]

[[bin]]
name = "dayframe_web"
path = "main.rs"

[lints]
workspace = true
