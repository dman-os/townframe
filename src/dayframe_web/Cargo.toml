[package]
name = "dayframe_web"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true }
ui = { workspace = true }
dayframe_composition = { workspace = true }
clay_dioxus = { workspace = true }
clay_micro_core = { workspace = true }
clay_mdk = { workspace = true, features = ["in_process", "view", "wcmp"] }
clay_rt_wcmp = { workspace = true }
micro_counter_manifest = { workspace = true }
wcmp.workspace = true
wcmp-wasm-core-web.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Response", "Document", "Element"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
console_error_panic_hook = "0.1.7"

[features]
default = ["web"]
web = ["dioxus/web"]

[[bin]]
name = "dayframe_web"
path = "main.rs"

[lints]
workspace = true
