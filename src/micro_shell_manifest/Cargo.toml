[package]
name = "micro_shell_manifest"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[lints]
workspace = true

[dependencies]
#
# internal
clay_mdk = { workspace = true, features = ["contract"] }

#
# misc
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
# `host::declared_rows` checks the declared rows in tests; the contract itself stays backend-free
# so any micro, native or Wasm, can contribute panels without linking the in-process backend.
clay_mdk = { workspace = true, features = ["in_process"] }
ciborium.workspace = true
insta.workspace = true
