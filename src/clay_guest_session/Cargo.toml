[package]
name = "clay_guest_session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "lib.rs"

[dependencies]
clay_data = { path = "../clay_data" }
clay_host = { path = "../clay_host" }
tokio = { workspace = true, features = ["macros", "sync"] }

[dev-dependencies]
daybook_types = { workspace = true, default-features = false, features = ["manifest"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
