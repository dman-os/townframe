version = 1
role = "runtime"
dependency_reason = "dayframe microkernel layering: engine-neutral contracts at the bottom, micros above them, composition roots on top"
allowed_dependencies = [
    "clay_collection",
    "clay_docs",
    "clay_host",
    "clay_store",
    "clay_surface",
    "daybook_types",
]
allow_external_api_types = false

# The browser host (ADR 018) links this crate on wasm32, so both targets are contracts.
[builds.native]
# `test-utils` carries the engine conformance scenarios the engine crates run natively.
features = ["test-utils"]

[builds.wasm32-unknown-unknown]

[builds.wasm32-wasip3]

[[exemptions]]
code = "ERROR_DEPENDENCY_GROUP"
path = "src/clay_guest_session/Cargo.toml"
symbol = "dependency-groups"
ceiling = 6
class = "LEGACY_DEBT"
reason = "internal crates are not yet grouped under a `#` / `# internal` comment header: move them into one group at the top of each dependency table"
reference = "docs/scratch/nodule-runtime-ledger.md"
