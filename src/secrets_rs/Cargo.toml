[package]
name = "secrets_rs"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
#
# internal
utils_rs = { workspace = true, features = ["hash"] }
iroh.workspace = true

#
# os
keyring-core = { version = "1.0", default-features = false }

#
# ds
thiserror = "2"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }

#
# async
tokio = { workspace = true, features = ["sync", "macros", "rt"] }
tracing = { workspace = true, features = [] }

[features]
test-support = []

[dev-dependencies]

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0", features = ["rt-tokio-crypto-rust"] }
linux-keyutils-keyring-store = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.0" }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = { version = "1.0" }