version = 1
role = "application"
dependency_reason = "dayframe microkernel layering: engine-neutral contracts at the bottom, micros above them, composition roots on top"
allowed_dependencies = [
    "clay_dioxus",
    "clay_docs",
    "clay_guest_session",
    "clay_host",
    "clay_mdk",
    "clay_rt_wcmp",
    "clay_store",
    "clay_surface",
    "daybook_types",
    "dayframe_composition",
    "micro_counter_manifest",
    "micro_lab_manifest",
    "micro_layout_manifest",
    "micro_sample",
    "micro_settings",
    "micro_settings_manifest",
    "micro_shell",
    "micro_shell_manifest",
    "micro_toolbar",
    "micro_toolbar_manifest",
    "sqlite_rs",
    "ui",
]
allow_external_api_types = false

# Desktop is the native launch shell only (ADR 018 §7). The shell is meaningless without
# the `desktop` (Wry) renderer feature, so the matrix never builds it bare; `blitz` adds the
# Blitz launcher next to it.
[builds.native]
features = ["blitz"]
required_features = ["desktop"]
