[package]
name = "dayframe_desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dayframe_desktop"
path = "main.rs"

[dependencies]
dioxus = { workspace = true }
ui = { workspace = true }
dayframe_composition = { workspace = true }
clay_docs = { workspace = true }
clay_dioxus = { workspace = true }
clay_host = { workspace = true }
clay_mdk = { workspace = true, features = ["in_process", "view", "wasmtime", "wcmp", "package"] }
clay_store = { workspace = true }
sqlite_rs = { workspace = true }
micro_settings = { workspace = true }
micro_settings_manifest = { workspace = true }
micro_shell = { workspace = true }
micro_shell_manifest = { workspace = true }
micro_toolbar = { workspace = true }
micro_toolbar_manifest = { workspace = true }
micro_sample = { workspace = true }
micro_counter_manifest = { workspace = true }
daybook_types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

dioxus-native = { workspace = true, features = ["scrollbars"], optional = true }
anyrender = { version = "0.13.0", optional = true }
anyrender_vello = { version = "0.14.0", optional = true }
anyrender_vello_cpu = { version = "0.17.0", optional = true }
anyrender_vello_hybrid = { version = "0.10.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Blitz disables xplat defaults; explicitly enable the Unix backend and its executor.
accesskit_xplat = { version = "0.2.1", optional = true }

[features]
default = ["desktop"]
# The shipping renderer: the shell in a system webview (Wry).
desktop = ["dioxus/desktop"]
# Blitz, opt-in and additive: compiled in next to Wry, launched by `DAYFRAME_RENDERER=blitz`
# (`x/dayframe.ts desktop --native` sets both).
blitz = [
    "dioxus/native",
    "dep:dioxus-native",
    "dep:anyrender",
    "dep:anyrender_vello",
    "dep:anyrender_vello_cpu",
    "dep:anyrender_vello_hybrid",
    "dep:accesskit_xplat",
]

[dev-dependencies]
ciborium.workspace = true
micro_layout_manifest = { workspace = true }
micro_lab_manifest = { workspace = true }
clay_guest_session = { workspace = true }
clay_surface = { workspace = true }
clay_rt_wcmp = { workspace = true }
wcmp = { workspace = true }
wcmp-wasm-core-wasmi = { workspace = true }
blitz-dom.workspace = true
blitz-html = "0.3.0-beta.4"
blitz-paint = "0.3.0-beta.4"
blitz-traits = "0.3.0-beta.4"
# The anyrender the pinned blitz-paint draws into (the unrelated 0.13/0.17 pair above is what the
# renderer features pull for the launchers; a scene painter of a different version does not
# implement blitz-paint's `PaintScene`).
anyrender_blitz = { package = "anyrender", version = "0.14.0" }
anyrender_vello_cpu_blitz = { package = "anyrender_vello_cpu", version = "0.18.0" }
dioxus-core.workspace = true
dioxus-html.workspace = true
dioxus-native-dom.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }