[package]
name = "dayframe_desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dayframe_desktop"
path = "main.rs"

[dependencies]
dioxus = { workspace = true }
ui = { workspace = true }
dayframe_composition = { workspace = true }
clay_micro_core = { workspace = true }
clay_docs = { workspace = true }
clay_dioxus = { workspace = true }
clay_host = { workspace = true }
clay_mdk = { workspace = true, features = ["in_process", "view", "wasmtime"] }
micro_settings = { workspace = true }
micro_settings_manifest = { workspace = true }
micro_sample = { workspace = true }
micro_counter_manifest = { workspace = true }
daybook_types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

dioxus-native = { workspace = true, features = ["scrollbars"] }
anyrender = { version = "0.13.0" }
anyrender_vello = { version = "0.14.0" }
anyrender_vello_cpu = { version = "0.17.0" }
anyrender_vello_hybrid = { version = "0.10.0" }

[target.'cfg(target_os = "linux")'.dependencies]
# Blitz disables xplat defaults; explicitly enable the Unix backend and its executor.
accesskit_xplat = "0.2.1"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]

[dev-dependencies]
clay_surface = { workspace = true }
blitz-dom.workspace = true
dioxus-core.workspace = true
dioxus-html.workspace = true
dioxus-native-dom.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }