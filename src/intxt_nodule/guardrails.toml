version = 1
role = "plugin"
dependency_reason = "intxt as a cartridge: the manifest that admits intxt's vocabularies to a node, with the storage forms their Lexicons cannot state, and later the nodule handlers serving its operations."
allowed_dependencies = [
    "big_cabinet_core",
    "big_cartridges_core",
    "big_ndk_testing",
    "big_nodule_core",
    "intxt_core",
    "service_utils_rs",
]
allow_external_api_types = false

[api]
target = "x86_64-unknown-linux-gnu"
default_features = true
features = []

[builds.native]
