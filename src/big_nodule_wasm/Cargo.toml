[package]
name = "big_nodule_wasm"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[dependencies]
#
# internal
big_blobs.workspace = true
big_blobs_core.workspace = true
big_cabinet_core = { workspace = true, features = ["manifest"] }
big_dispatch.workspace = true
big_dispatch_core.workspace = true
method_core.workspace = true

big_nodule.workspace = true
big_nodule_core = { workspace = true, features = ["schemars"] }
big_cartridges_core.workspace = true
big_sync_core.workspace = true
service_client_native_rs.workspace = true
service_utils_rs.workspace = true
utils_rs.workspace = true

#
# wasm host
wash-runtime.workspace = true
wasmtime-wasi-http.workspace = true
hyper.workspace = true
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "aws-lc-rs"] }
tower.workspace = true
thiserror.workspace = true
http-body-util = "0.1"
http-body = "1.0"
futures.workspace = true
bytes.workspace = true
blake3.workspace = true
# encoding, errors and state
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "net"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
