[package]
name = "big_nodule_wasm"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[dependencies]
# internal
big_blobs = { path = "../big_blobs" }
big_blobs_core = { path = "../big_blobs_core" }
big_cabinet_core = { path = "../big_cabinet_core" }
big_dispatch.workspace = true
big_dispatch_core.workspace = true
big_nodule.workspace = true
big_nodule_core = { workspace = true, features = ["schemars"] }
big_cartridges_core.workspace = true
big_sync_core.workspace = true
service_client_native_rs.workspace = true
service_utils_rs.workspace = true
utils_rs.workspace = true

# wasm host
wash-runtime.workspace = true
wasmtime-wasi-http.workspace = true
hyper.workspace = true
http-body-util = "0.1"
bytes.workspace = true
blake3.workspace = true

# encoding, errors and state
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
