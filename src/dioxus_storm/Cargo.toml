[package]
name = "dioxus_storm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "lib.rs"

[lints]
workspace = true

[dependencies]
dioxus-core.workspace = true
dioxus-html = { workspace = true, features = ["serialize"] }
serde_json.workspace = true
# `test-util` for the paused clock: a storm runs animation timers in virtual time, so it is
# instant and deterministic.
tokio = { workspace = true, features = ["rt", "time", "test-util"] }

[dev-dependencies]
dioxus = { git = "https://github.com/dman-os/dioxus", rev = "a3e1e68334b7dfa68cead38e9e8795ec7a6b534a", default-features = false, features = ["macro", "signals", "hooks", "html"] }
