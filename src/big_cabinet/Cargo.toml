[package]
name = "big_cabinet"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[dependencies]
#
# internal
utils_rs.workspace = true
big_cabinet_core = { path = "../big_cabinet_core" }
big_sync_core.workspace = true
big_repo.workspace = true
secrets_rs.workspace = true

#
# encoding
atproto-dasl.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true

#
# crypto and identity
ed25519-dalek.workspace = true
rand.workspace = true
uuid.workspace = true

#
# errors and durable authority state
thiserror.workspace = true
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio"] }
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
secrets_rs = { workspace = true, features = ["test-support"] }
keyring-core = { version = "1.0", default-features = false }
tempfile.workspace = true
schemars = "1.2.2"
