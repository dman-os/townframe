[package]
name = "big_cabinet"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[dependencies]
# internal
utils_rs.workspace = true
big_cabinet_core = { path = "../big_cabinet_core", features = ["schemars"] }
big_sync_core.workspace = true
big_sync.workspace = true
big_repo.workspace = true
secrets_rs.workspace = true
service_utils_rs.workspace = true
sqlx_utils_rs.workspace = true

# service protocol declaration: `service_protocol!` expands to irpc and tracing
irpc.workspace = true
tracing.workspace = true

# encoding
automerge.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
uuid = { workspace = true, features = ["v4"] }
atproto-dasl.workspace = true
jiff.workspace = true

# crypto and identity
ed25519-dalek.workspace = true
rand.workspace = true
zeroize = "1"

# errors and durable authority state
thiserror.workspace = true
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio"] }
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
proptest.workspace = true
keyring-core = { version = "1.0", default-features = false }
tempfile.workspace = true
url.workspace = true
schemars = "1.2.2"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
ed25519-dalek.workspace = true
