# nextest *user* configuration for CI, passed explicitly with
# `cargo nextest run --user-config-file .config/nextest-user-ci.toml`.
#
# nextest deliberately keeps the record store settings out of repository configuration
# (`.config/nextest.toml`), so this file exists only to make CI recording reproducible.

[experimental]
record = true

[record]
enabled = true

# Cap per stdout/stderr stream. nextest elides the *middle* of oversized output, so panics and
# assertion failures at the end of a stream survive truncation.
max-output-size = "256KB"

# Retention is LRU by last write, and a single run larger than `max-total-size` evicts itself,
# so keep the ceiling comfortably above the largest plausible CI run.
max-records = 3
max-total-size = "2GB"
