[profile.default]
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'test(/long_test/)'
slow-timeout = { period = "60s", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'test(/long_af_test/)'
slow-timeout = { period = "60s", terminate-after = 8 }

# The big_node blob_discovery e2e tests each boot two nodes with several drawers and take
# 95-105 s alone; run beside a full parallel suite they are 4-10x slower and hit the default
# kill. Cap how many run at once and give them the same budget as `long_af_test`.
[test-groups.big-node-blob-discovery]
max-threads = 2

[[profile.default.overrides]]
filter = 'package(big_node) and test(/blob_discovery::/)'
test-group = 'big-node-blob-discovery'
slow-timeout = { period = "60s", terminate-after = 8 }

[profile.ci]
fail-fast = false
retries = { backoff = "exponential", count = 3, delay = "2s", max-delay = "10s", jitter = true }
failure-output = "never"
 
[profile.ci.junit]
path = "target/nextest/ci/results.xml"
store-failure-output = false
store-success-output = false

# Nightly cron runs keep the CI retry schedule but report any test that needed a retry as a
# failure, so a flake surfaces as a red run with its seed instead of hiding behind a green
# retry. PR runs keep `ci` (flaky tests pass) so transient CI noise does not block merges.
[profile.nightly]
inherits = "ci"
flaky-result = "fail"

[profile.nightly.junit]
path = "target/nextest/ci/results.xml"
store-failure-output = false
store-success-output = false
