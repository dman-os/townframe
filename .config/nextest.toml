[profile.default]
slow-timeout = { period = "60s", terminate-after = 2 }
# flaky-result = "fail"

# Native graph fixtures are internally multithreaded; reserve their CPU footprint
# instead of starting one whole service graph per available runner thread.
# This changes resource accounting, not deadlines, retries, or scenario assertions.
[[profile.default.overrides]]
filter = 'package(daybook_core) & (test(sync::tests::) | test(tasks::transport::tests::) | test(test_support::sync_node::tests::))'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'test(/long_test/)'
slow-timeout = { period = "60s", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'test(/long_af_test/)'
slow-timeout = { period = "60s", terminate-after = 8 }

[profile.ci]
fail-fast = false
retries = { backoff = "exponential", count = 3, delay = "2s", max-delay = "10s", jitter = true }
# Captured test output belongs in the uploaded artifacts, not the job log: at RUST_LOG_TEST=debug a
# single failing test can emit thousands of lines. The failure detail is in the `nextest-results`
# JUnit artifact (store-failure-output below) and in the `nextest-recording` zip.
failure-output = "never"
 
[profile.ci.junit]
path = "target/nextest/ci/results.xml"
store-failure-output = true
